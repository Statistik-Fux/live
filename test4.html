<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handball Kollektiv - Anzeige</title>
<style>
:root{--primary:#0d5b1f;--primary2:#1e7a31;--red:#d91f26;--text:#1f261f;--muted:#647064;--bg:#f3f5f0;--border:rgba(18,35,20,.12);--radius:1rem;--space:1.25rem}*{box-sizing:border-box}html,body{margin:0;padding:0}body{min-height:100vh;font-family:Arial,sans-serif;color:#111;background:linear-gradient(180deg,rgba(13,91,31,.05),var(--bg))}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{max-width:1360px;margin:auto;padding:var(--space)}.panel{border:1px solid var(--border);border-radius:var(--radius);background:rgba(255,255,255,.95);box-shadow:0 12px 28px rgba(9,27,12,.08)}
.setup{max-width:760px;margin:6vh auto 0;padding:4rem 2rem}.setup-grid{display:grid;gap:var(--space);justify-items:center}.logo-setup{width:100%;height:280px;background:url("logo.png.JPG") center/contain no-repeat;opacity:.8}.field{text-align:center}.field label{display:block;font-weight:700;margin-bottom:.5rem}.field input{width:min(100%,360px);padding:1rem;border:1px solid var(--border);border-radius:.8rem;background:#fff}.start-btn{min-height:52px;min-width:160px;border:0;border-radius:.8rem;background:linear-gradient(90deg,var(--primary),var(--primary2));color:#fff;font-weight:700}
.workspace{margin-top:var(--space)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:var(--space);padding:var(--space);margin-bottom:var(--space)}.brand-stack{display:flex;align-items:center;gap:var(--space)}.brand-logo{width:92px;height:92px;object-fit:contain;border-radius:1rem;background:#fff;padding:8px}.topbar h1{margin:0;font-size:1.6rem}.topbar-meta{color:var(--muted);margin-top:.4rem}.utility-btn{padding:.8rem 1rem;border:1px solid var(--border);border-radius:.8rem;background:#fff}.utility-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.tables{display:grid;gap:var(--space)}.table-card{padding:var(--space);overflow:visible}.offense{border-top:8px solid var(--primary)}.defense{border-top:8px solid var(--red)}.table-tools{display:grid;grid-template-columns:1fr auto;align-items:center;gap:1rem;margin-bottom:1rem}.table-tools h2{margin:0;font-size:1.3rem}.table-controls{display:flex;align-items:center;justify-content:flex-end;gap:.75rem;flex-wrap:wrap}.entry-count{padding:.35rem .75rem;border-radius:999px;font-weight:700;background:#eef2ea}.sort-info{color:var(--muted);font-size:.9rem;font-weight:700}.sort-info::before{content:"Sortierung: ";font-weight:400}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff}table{width:100%;table-layout:fixed;border-collapse:collapse}th,td{padding:.8rem .7rem;border-bottom:1px solid rgba(40,37,29,.09);text-align:left;vertical-align:top;word-break:break-word}th{background:#eef2ea}th button{background:transparent;border:0;padding:0;font-weight:700}tbody tr:hover{background:#faf8f3}.empty{text-align:center;color:var(--muted);padding:2rem}.pill{display:inline-flex;border-radius:999px;padding:.2rem .55rem;background:#eee;font-weight:700}.number{background:#f2edf8;color:#53306f}.green-tag{background:#e1f0dc;color:#1b5c26}.red-tag{background:#f8dfdf;color:#8d2424}.yellow-tag{background:#f7edc6;color:#7b5c00}
.filter-box{min-width:min(100%,310px);position:relative}.filter-toggle{min-height:42px;padding:.55rem .85rem;border:1px solid var(--border);border-radius:999px;background:#fff;font-weight:700}.filter-summary{color:var(--muted);font-size:.88rem;font-weight:400}.filter-menu{display:none;position:absolute;z-index:20;top:calc(100% + .45rem);right:0;width:min(560px,calc(100vw - 3rem));max-height:60vh;overflow:auto;padding:.8rem;border:1px solid var(--border);border-radius:var(--radius);background:#fff;box-shadow:0 12px 30px rgba(9,27,12,.16)}.filter-box.open .filter-menu{display:grid;gap:.7rem}.filter-menu-header{display:flex;justify-content:space-between;padding-bottom:.55rem;border-bottom:1px solid var(--border)}.filter-menu-clear{border:0;background:transparent;color:var(--primary);font-weight:700}.filter-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.75rem}.filter-group{display:grid;gap:.35rem}.filter-group-title{color:var(--muted);font-size:.78rem;font-weight:700;text-transform:uppercase}.filter-options{display:grid;gap:.25rem}.filter-option{display:flex;gap:.4rem;padding:.35rem;font-size:.88rem}.filter-tags{display:flex;flex-wrap:wrap;gap:.3rem}.filter-tag{display:inline-flex;gap:.25rem;padding:.2rem .5rem;border-radius:999px;background:#eef2ea;font-size:.78rem}.filter-tag button{border:0;background:transparent;font-weight:700}
.quote-chart{margin-top:var(--space);padding:var(--space);border-top:1px solid var(--border)}.quote-chart h3{margin:0 0 1rem;font-size:1.2rem}.handball-court{position:relative;width:100%;aspect-ratio:1.65/1;border:3px solid #111;background:#fff;overflow:hidden}.court-midline{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#111;transform:translateX(-50%)}.court-goal{position:absolute;left:44%;right:44%;top:0;height:6%;border:2px solid #111;border-top:0}.six-meter{position:absolute;left:22%;right:22%;top:0;height:30%;border:2px solid #111;border-top:0;border-radius:0 0 50% 50%}.nine-meter{position:absolute;left:10%;right:10%;top:0;height:43%;border:2px dashed #111;border-top:0;border-radius:0 0 50% 50%}.court-sections{position:absolute;inset:0;display:grid;grid-template-columns:8fr 22fr 23fr 23fr 22fr 8fr}.court-section{position:relative;border-right:2px solid rgba(0,0,0,.55)}.court-section:last-child{border-right:0}.court-section.empty{background:rgba(245,245,245,.38)}.court-section:nth-child(2),.court-section:nth-child(5){border-right:0}.court-section:nth-child(2)::before,.court-section:nth-child(5)::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.55);transform-origin:top}.court-section:nth-child(2)::before{right:0;transform:rotate(40deg)}.court-section:nth-child(5)::before{left:0;transform:rotate(-40deg)}.section-number{position:absolute;top:3%;left:50%;transform:translateX(-50%);font-size:clamp(1.5rem,3.6vw,3.1rem);font-weight:800;color:#222;z-index:3}.court-section.empty .section-number{display:none}.stat-content{position:absolute;left:50%;top:70%;transform:translate(-50%,-50%);width:100%;text-align:center}.quote{display:block;font-size:clamp(1.2rem,3vw,2rem);font-weight:800;line-height:1}.detail{display:block;margin-top:.45rem;font-size:clamp(.78rem,1.5vw,1rem);color:#444}.zone-green{background:rgba(63,125,50,.22)}.zone-yellow{background:rgba(169,121,0,.20)}.zone-red{background:rgba(177,58,58,.20)}.zone-empty{background:rgba(130,130,130,.08)}.chart-legend{margin:.8rem 0 0;color:var(--muted);font-size:.82rem;text-align:center}
@media(max-width:760px){.app{padding:.8rem}.setup,.table-card,.topbar{padding:1rem}.topbar{flex-direction:column;align-items:stretch}.table-tools{grid-template-columns:1fr}.table-controls{justify-content:flex-start}.filter-menu{position:fixed;right:1rem;bottom:1rem;top:auto;width:calc(100vw - 2rem)}.handball-court{aspect-ratio:1.25/1}.stat-content{top:72%}}
</style>
</head>
<body>
<div class="app">
<section id="setup" class="panel setup"><div class="setup-grid"><div class="logo-setup"></div><div class="field"><label for="opponent">Gegner</label><input id="opponent" type="text" placeholder="Gegner eingeben"></div><div class="field"><label for="matchDate">Datum</label><input id="matchDate" type="date"></div><button id="startBtn" class="start-btn" type="button">Start</button></div></section>
<section id="workspace" class="workspace hidden"><div class="panel topbar"><div class="brand-stack"><img id="brandLogo" src="./logo.png.JPG" alt="Logo" class="brand-logo"><div><h1 id="headline">Anzeige</h1><div id="topMeta" class="topbar-meta"></div></div></div><button id="pdfBtn" class="utility-btn primary" type="button">Export PDF</button></div><div class="tables">
<section class="panel table-card offense"><div class="table-tools"><h2>Offensive Aktionen</h2><div class="table-controls"><div class="entry-count" id="offenseCount">0 Einträge</div><div class="filter-box" id="offenseFilterBox"><button id="offenseFilterToggle" class="filter-toggle" type="button">Filter <span id="offenseFilterSummary" class="filter-summary">keine Auswahl</span></button><div id="offenseFilterMenu" class="filter-menu"><div class="filter-menu-header"><strong>Filter auswählen</strong><button id="offenseFilterReset" class="filter-menu-clear" type="button">Zurücksetzen</button></div><div id="offenseFilterTags" class="filter-tags"></div><div id="offenseFilterControls" class="filter-groups"></div></div></div><div id="offenseSortInfo" class="sort-info"></div></div></div><div class="table-wrap"><table><thead><tr><th><button data-table="offense" data-sort="index" type="button">#</button></th><th><button data-table="offense" data-sort="structure" type="button">Struktur</button></th><th><button data-table="offense" data-sort="position" type="button">angegriffene Position</button></th><th><button data-table="offense" data-sort="half" type="button">Halbzeit</button></th><th><button data-table="offense" data-sort="result" type="button">Ergebnis</button></th><th><button data-table="offense" data-sort="number" type="button">Zahl</button></th></tr></thead><tbody id="offenseTableBody"></tbody></table></div></section>
<section class="panel table-card defense"><div class="table-tools"><h2>Defensive Aktionen</h2><div class="table-controls"><div class="entry-count" id="defenseCount">0 Einträge</div><div class="filter-box" id="defenseFilterBox"><button id="defenseFilterToggle" class="filter-toggle" type="button">Filter <span id="defenseFilterSummary" class="filter-summary">keine Auswahl</span></button><div id="defenseFilterMenu" class="filter-menu"><div class="filter-menu-header"><strong>Filter auswählen</strong><button id="defenseFilterReset" class="filter-menu-clear" type="button">Zurücksetzen</button></div><div id="defenseFilterTags" class="filter-tags"></div><div id="defenseFilterControls" class="filter-groups"></div></div></div><div id="defenseSortInfo" class="sort-info"></div></div></div><div class="table-wrap"><table><thead><tr><th><button data-table="defense" data-sort="index" type="button">#</button></th><th><button data-table="defense" data-sort="positionLabel" type="button">angegriffene Position</button></th><th><button data-table="defense" data-sort="finishPositionLabel" type="button">Abschlussposition</button></th><th><button data-table="defense" data-sort="half" type="button">Halbzeit</button></th><th><button data-table="defense" data-sort="number" type="button">Zahl</button></th></tr></thead><tbody id="defenseTableBody"></tbody></table></div>
<div class="quote-chart"><h3>Zweikampfquote nach angegriffener Position</h3><div class="handball-court"><div class="court-midline"></div><div class="court-goal"></div><div class="six-meter"></div><div class="nine-meter"></div><div class="court-sections"><div class="court-section empty"><span class="section-number">1</span></div><div class="court-section" id="pos2"><span class="section-number">2</span><div class="stat-content"><span class="quote">—</span><span class="detail">0 / 0</span></div></div><div class="court-section" id="pos3"><span class="section-number">3</span><div class="stat-content"><span class="quote">—</span><span class="detail">0 / 0</span></div></div><div class="court-section" id="pos4"><span class="section-number">4</span><div class="stat-content"><span class="quote">—</span><span class="detail">0 / 0</span></div></div><div class="court-section" id="pos5"><span class="section-number">5</span><div class="stat-content"><span class="quote">—</span><span class="detail">0 / 0</span></div></div><div class="court-section empty"><span class="section-number">6</span></div></div></div><p class="chart-legend">Grün: ab 60 % · Gelb: 40–59 % · Rot: unter 40 %</p></div>
</section></div></section></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){'use strict';
const db=window.supabase.createClient('https://lyrqevymateeftoqxbua.supabase.co','sb_publishable_JRYstud4CcOx7sC27GQlYQ_xziqf5df');const $=id=>document.getElementById(id);const state={meta:{},offense:[],defense:[],sort:{offense:{key:'index',dir:'desc'},defense:{key:'index',dir:'desc'}}};const filters={offense:[],defense:[]};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const half=v=>v==='2.hz'||v==='2. HZ'?'2. HZ':'1. HZ';const nums=v=>Array.isArray(v)?(v.length?v:['6:6']):(!v?['6:6']:String(v).split(' + ').filter(Boolean));const finish=e=>e.finishPosition==='freiwurf'?'Freiwurf':e.finishPosition==='tf'?'TF':e.finishPosition||'';
const filterOptions={offense:{structure:{label:'Struktur',values:['Kreis breit 1/2','Kreis breit 5/6','2/3','4/5','3/4 -> 2','3/4 -> 5','3/4','1. Welle','2. Welle','3. Welle','Schnelle Mitte']},position:{label:'Position',values:['2','3','4','5']},half:{label:'Halbzeit',values:['1. HZ','2. HZ']},number:{label:'Zahl',values:['6:6','6:5','7:6']},result:{label:'Ergebnis',values:['gute Chance - Tor','gute Chance - kein Tor','Freiwurf','TF','schlechte Chance - kein Tor','schlechte Chance - Tor']}},defense:{position:{label:'Position',values:['2','3','4','5']},finishPosition:{label:'Abschlussposition',values:['Außen','Kreis/DBR breit','Kreis/DBR zentral','Fernwurf','7m','Freiwurf','TF']},half:{label:'Halbzeit',values:['1. HZ','2. HZ']},number:{label:'Zahl',values:['6:6','6:5','7:6','Tempo']},result:{label:'Ergebnis',values:['Erfolg','Misserfolg','Freiwurf','TF']}}};
async function load(){const r=await db.from('match_actions').select('*').eq('match_opponent',state.meta.opponent).eq('match_date',state.meta.matchDate).order('created_order',{ascending:true});if(r.error){console.error(r.error);state.offense=[];state.defense=[];return}const d=r.data||[];state.offense=d.filter(x=>x.side==='offense').map(x=>({...x,position:x.attack_position??x.position??'',half:x.half,number:x.number_relation??x.number??'6:6',structure:x.structure??'',resultDisplay:x.result_display??x.result??'',createdOrder:x.created_order??0}));state.defense=d.filter(x=>x.side==='defense').map(x=>({...x,position:x.attack_position??x.position??'',positionSide:x.position_side??'',finishPosition:x.finish_position??'',finishSide:x.finish_side??'',half:x.half,number:x.number_relation??x.number??'6:6',createdOrder:x.created_order??0,resultDisplay:x.result_display??x.result??''}))}
function filterMatch(row,f){if(f.key==='position')return row.position===f.value;if(f.key==='half')return half(row.half)===f.value;if(f.key==='number')return nums(row.number).includes(f.value);if(f.key==='structure')return String(row.structure||'').split(' + ').includes(f.value);if(f.key==='finishPosition')return finish(row)===f.value;if(f.key==='result')return(row.resultDisplay||'')===f.value;return true}
function renderFilters(domain){const selected=filters[domain];$(domain+'FilterControls').innerHTML=Object.entries(filterOptions[domain]).map(([key,s])=>`<div class="filter-group"><div class="filter-group-title">${esc(s.label)}</div><div class="filter-options">${s.values.map(v=>`<label class="filter-option"><input type="checkbox" data-key="${esc(key)}" data-value="${esc(v)}" ${selected.some(f=>f.key===key&&f.value===v)?'checked':''}>${esc(v)}</label>`).join('')}</div></div>`).join('');$(domain+'FilterControls').querySelectorAll('input').forEach(i=>i.addEventListener('change',()=>{const f={key:i.dataset.key,value:i.dataset.value};if(i.checked){if(selected.length<3)selected.push(f);else{i.checked=false;alert('Es können höchstens drei Filter ausgewählt werden.')}}else filters[domain]=selected.filter(x=>x.key!==f.key||x.value!==f.value);renderTable(domain)}));$(domain+'FilterTags').innerHTML=selected.map(f=>`<span class="filter-tag">${esc(filterOptions[domain][f.key].label)}: ${esc(f.value)}<button data-key="${esc(f.key)}" data-value="${esc(f.value)}" type="button">×</button></span>`).join('');$(domain+'FilterTags').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{filters[domain]=selected.filter(f=>f.key!==b.dataset.key||f.value!==b.dataset.value);renderTable(domain)}));$(domain+'FilterSummary').textContent=selected.length?selected.length+' aktiv':'keine Auswahl'}
function value(row,key){if(key==='index')return row.createdOrder||0;if(key==='structure')return row.structure||'';if(key==='position'||key==='positionLabel')return row.position||'';if(key==='finishPositionLabel')return finish(row);if(key==='half')return half(row.half);if(key==='number')return nums(row.number).join(' + ');if(key==='result')return row.resultDisplay||'';return''}
function renderTable(domain){const source=domain==='offense'?state.offense:state.defense;const sort=state.sort[domain];const rows=source.filter(r=>filters[domain].every(f=>filterMatch(r,f))).sort((a,b)=>{const av=value(a,sort.key),bv=value(b,sort.key);return(typeof av==='number'?av-bv:String(av).localeCompare(String(bv),'de'))*(sort.dir==='asc'?1:-1)});const body=$(domain+'TableBody');$(domain+'Count').textContent=source.length+' Einträge';$(domain+'SortInfo').textContent=sort.dir==='asc'?'↑':'↓';renderFilters(domain);if(!rows.length){body.innerHTML=`<tr><td colspan="${domain==='offense'?6:5}" class="empty">Noch keine Einträge.</td></tr>`;return}body.innerHTML=rows.map((r,i)=>domain==='offense'?`<tr><td>${i+1}</td><td>${esc(r.structure||'—')}</td><td>${esc(r.position||'—')}</td><td>${esc(half(r.half))}</td><td>${esc(r.resultDisplay||'')}</td><td>${nums(r.number).map(n=>`<span class="pill number">${esc(n)}</span>`).join(' ')}</td></tr>`:`<tr><td>${i+1}</td><td><span class="pill ${r.positionSide==='green'?'green-tag':r.positionSide==='yellow'?'yellow-tag':'red-tag'}">${esc(r.position||'—')}</span></td><td><span class="pill ${r.finishSide==='green'?'green-tag':r.finishSide==='yellow'?'yellow-tag':'red-tag'}">${esc(finish(r)||'—')}</span></td><td>${esc(half(r.half))}</td><td>${nums(r.number).map(n=>`<span class="pill number">${esc(n)}</span>`).join(' ')}</td></tr>`).join('')}
function renderChart(){['2','3','4','5'].forEach(p=>{const rows=state.defense.filter(r=>r.position===p);const won=rows.filter(r=>r.positionSide==='green').length;const quote=rows.length?Math.round(won/rows.length*100):null;const box=$('pos'+p);box.classList.remove('zone-green','zone-yellow','zone-red','zone-empty');box.classList.add(quote===null?'zone-empty':quote<40?'zone-red':quote<60?'zone-yellow':'zone-green');box.querySelector('.quote').textContent=quote===null?'—':quote+'%';box.querySelector('.detail').textContent=won+' / '+rows.length})}
async function refresh(){await load();renderTable('offense');renderTable('defense');renderChart()}
function start(){const opponent=$('opponent').value.trim(),date=$('matchDate').value;if(!opponent||!date){alert('Bitte Gegner und Datum eintragen.');return}state.meta={opponent,matchDate:date};$('headline').textContent='Anzeige vs '+opponent;$('topMeta').textContent=new Date(date+'T00:00:00').toLocaleDateString('de-DE');$('setup').classList.add('hidden');$('workspace').classList.remove('hidden');refresh()}
function exportPdf(){if(!window.jspdf||!window.jspdf.jsPDF){alert('Das PDF-Modul konnte nicht geladen werden.');return}const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});doc.text('Kollektive Statistik vs '+state.meta.opponent,14,14);doc.save('Kollektive_Statistik.pdf')}
$('startBtn').addEventListener('click',start);$('pdfBtn').addEventListener('click',exportPdf);$('opponent').addEventListener('keydown',e=>{if(e.key==='Enter')start()});$('matchDate').addEventListener('keydown',e=>{if(e.key==='Enter')start()});['offense','defense'].forEach(d=>{$(d+'FilterToggle').addEventListener('click',()=>$(d+'FilterBox').classList.toggle('open'));$(d+'FilterReset').addEventListener('click',()=>{filters[d].length=0;renderTable(d)})});document.querySelectorAll('th button[data-table]').forEach(b=>b.addEventListener('click',()=>{const s=state.sort[b.dataset.table];if(s.key===b.dataset.sort)s.dir=s.dir==='asc'?'desc':'asc';else{s.key=b.dataset.sort;s.dir=b.dataset.sort==='index'?'desc':'asc'}renderTable(b.dataset.table)}));$('matchDate').value=new Date().toISOString().slice(0,10);db.channel('match-actions-live').on('postgres_changes',{event:'*',schema:'public',table:'match_actions'},()=>{if(state.meta.opponent)refresh()}).subscribe();
})();
</script>
</body>
</html>
