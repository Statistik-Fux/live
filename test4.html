
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handball Kollektiv - Erfassung</title>
<meta name="theme-color" content="#0b4f16">

<style>
:root {
  --text-sm: clamp(.9rem,.82rem + .25vw,1rem);
  --text-base: clamp(1rem,.95rem + .25vw,1.08rem);
  --text-lg: clamp(1.12rem,1.02rem + .45vw,1.35rem);
  --text-xl: clamp(1.35rem,1.2rem + .6vw,1.7rem);
  --space-2: .5rem;
  --space-3: .75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --radius-md: .8rem;
  --radius-lg: 1rem;
  --radius-xl: 1.25rem;
  --shadow-md: 0 12px 28px rgba(9,27,12,.08);
  --shadow-sm: 0 2px 6px rgba(9,27,12,.06);
  --bg: #f3f5f0;
  --surface: rgba(255,255,255,.93);
  --surface-2: #eef2ea;
  --border: rgba(18,35,20,.12);
  --text: #1f261f;
  --muted: #647064;
  --primary: #0d5b1f;
  --primary-2: #1e7a31;
  --fox-red: #d91f26;
  --fox-red-dark: #b8171d;
  --green-strong: #3f7d32;
  --red-strong: #b13a3a;
  --yellow-strong: #a97900;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  font-size: var(--text-base);
  color: #111;
  background:
    radial-gradient(circle at top left, rgba(13,91,31,.12), transparent 30%),
    linear-gradient(180deg, rgba(13,91,31,.04), rgba(243,245,240,1) 26%),
    var(--bg);
}

button,
input,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

.app {
  max-width: 1360px;
  margin: 0 auto;
  padding: var(--space-5);
}

.panel {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  background: var(--surface);
  box-shadow: var(--shadow-md);
  backdrop-filter: blur(10px);
}

.setup {
  max-width: 760px;
  margin: 6vh auto 0;
  padding: clamp(4.5rem,8vw,6rem) var(--space-8) var(--space-8);
  position: relative;
  overflow: hidden;
}

.setup::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at center, rgba(255,255,255,.72), rgba(255,255,255,.93) 38%, rgba(255,255,255,.99)),
    linear-gradient(135deg, rgba(13,91,31,.03), rgba(217,31,38,.02));
  pointer-events: none;
}

.setup-grid {
  display: grid;
  gap: var(--space-5);
  justify-items: center;
  align-content: center;
  min-height: 520px;
  position: relative;
  z-index: 1;
}

.logo-setup {
  width: 100%;
  min-height: 320px;
  position: relative;
  background: url("logo.png.JPG") center/contain no-repeat;
  opacity: .8;
}

.field,
.notes {
  text-align: center;
}

.field label,
.notes label {
  display: block;
  font-weight: 700;
  margin-bottom: var(--space-2);
}

.field input,
.notes textarea {
  width: min(100%, 360px);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 1rem;
  background: #fff;
  color: var(--text);
}

.notes textarea {
  width: min(100%, 700px);
}

.field input:focus,
.notes textarea:focus {
  outline: 2px solid rgba(13,91,31,.15);
  border-color: var(--primary);
}

.start-btn,
.save-btn,
.utility-btn {
  min-height: 52px;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  font-weight: 700;
}

.start-btn {
  min-width: 160px;
  color: #fff;
  background: linear-gradient(90deg, var(--primary), var(--primary-2));
}

.workspace {
  margin-top: var(--space-5);
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-5) var(--space-6);
  margin-bottom: var(--space-5);
  background: linear-gradient(90deg, rgba(255,255,255,.98), rgba(245,247,243,.98));
}

.brand-stack {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  min-width: 0;
}

.brand-logo {
  width: 92px;
  height: 92px;
  border-radius: 22px;
  object-fit: contain;
  background: #fff;
  padding: 8px;
  border: 1px solid rgba(18,35,20,.08);
  box-shadow: var(--shadow-sm);
}

.topbar h1 {
  margin: 0;
  font-size: var(--text-xl);
}

.topbar-meta {
  color: var(--muted);
  font-size: var(--text-sm);
  margin-top: var(--space-2);
}

.topbar-actions {
  display: flex;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.utility-btn {
  background: #fff;
  border-color: var(--border);
  padding: .8rem 1rem;
  color: #000;
}

.utility-btn.primary {
  color: #fff;
  background: var(--primary);
  border-color: var(--primary);
}

.utility-btn.undo {
  width: 52px;
  padding: 0;
}

.dual-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-5);
}

.section-card {
  padding: var(--space-5);
  position: relative;
  overflow: hidden;
}

.section-card.offense {
  background: linear-gradient(180deg, rgba(13,91,31,.07), rgba(255,255,255,.95) 26%);
}

.section-card.defense {
  background: linear-gradient(180deg, rgba(217,31,38,.07), rgba(255,255,255,.95) 26%);
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

.section-head h2 {
  margin: 0;
  font-size: var(--text-lg);
}

.entry-count {
  border-radius: 999px;
  padding: .35rem .75rem;
  font-size: var(--text-sm);
  font-weight: 700;
}

.offense .entry-count {
  background: rgba(13,91,31,.12);
  color: var(--primary);
}

.defense .entry-count {
  background: rgba(217,31,38,.12);
  color: var(--fox-red-dark);
}

.controls {
  display: grid;
  gap: var(--space-4);
}

.group {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: rgba(255,255,255,.94);
  padding: var(--space-4);
}

.group h3 {
  margin: 0 0 var(--space-3);
  font-size: var(--text-base);
  color: #000;
}

.button-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
  gap: var(--space-3);
}

.button-grid.four {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.button-grid.two-wide {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.structure-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--space-3);
}

.structure-row + .structure-row {
  margin-top: var(--space-3);
}

.stack-grid {
  display: grid;
  gap: var(--space-3);
}

.result-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: var(--space-2);
}

.choice-btn,
.result-btn {
  min-height: 46px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: #fff;
  font-weight: 700;
  padding: .5rem .45rem;
  font-size: .94rem;
  color: #111;
  transition:
    transform .14s ease,
    border-color .14s ease,
    background-color .14s ease,
    box-shadow .14s ease;
}

.choice-btn:active,
.result-btn:active,
.save-btn:active,
.utility-btn:active,
.start-btn:active {
  transform: scale(.985);
}

.choice-btn.selected {
  background: rgba(13,91,31,.12);
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(13,91,31,.08) inset;
}

.defense .choice-btn.selected {
  background: rgba(217,31,38,.1);
  border-color: var(--fox-red);
  box-shadow: 0 0 0 2px rgba(217,31,38,.08) inset;
}

.choice-btn.green-variant {
  background: linear-gradient(180deg, #e7f5e2, #dbefd4);
  border-color: rgba(63,125,50,.28);
}

.choice-btn.red-variant {
  background: linear-gradient(180deg, #fae5e5, #f6d8d8);
  border-color: rgba(177,58,58,.28);
}

.choice-btn.yellow-variant {
  background: linear-gradient(180deg, #f7edc6, #f1e2a4);
  border-color: rgba(169,121,0,.35);
}

.choice-btn.green-variant.selected {
  background: rgba(63,125,50,.28);
  border-color: var(--green-strong);
}

.choice-btn.red-variant.selected {
  background: rgba(177,58,58,.28);
  border-color: var(--red-strong);
}

.choice-btn.yellow-variant.selected {
  background: rgba(169,121,0,.28);
  border-color: var(--yellow-strong);
}

.result-btn.green {
  background: linear-gradient(180deg, #dff0d9, #d2e9cb);
  border-color: rgba(63,125,50,.3);
}

.result-btn.red {
  background: linear-gradient(180deg, #f9dfdf, #f4caca);
  border-color: rgba(177,58,58,.3);
}

.result-btn.yellow {
  background: linear-gradient(180deg, #f7edc6, #f1e2a4);
  border-color: rgba(169,121,0,.35);
}

.result-btn.split-green-red {
  background: linear-gradient(90deg, #dff0d9 0 50%, #f9dfdf 50% 100%);
  border-color: rgba(110,95,95,.35);
}

.result-btn.split-red-green {
  background: linear-gradient(90deg, #f9dfdf 0 50%, #dff0d9 50% 100%);
  border-color: rgba(110,95,95,.35);
}

.result-btn.selected.green {
  background: rgba(63,125,50,.28);
  border-color: var(--green-strong);
}

.result-btn.selected.red {
  background: rgba(177,58,58,.28);
  border-color: var(--red-strong);
}

.result-btn.selected.yellow {
  background: rgba(169,121,0,.28);
  border-color: var(--yellow-strong);
}

.result-btn.selected.split-green-red {
  background: linear-gradient(90deg, rgba(63,125,50,.38) 0 50%, rgba(177,58,58,.34) 50% 100%);
  border-color: #6f6b60;
  box-shadow: 0 0 0 2px rgba(18,35,20,.08) inset;
}

.result-btn.selected.split-red-green {
  background: linear-gradient(90deg, rgba(177,58,58,.34) 0 50%, rgba(63,125,50,.38) 50% 100%);
  border-color: #6f6b60;
  box-shadow: 0 0 0 2px rgba(18,35,20,.08) inset;
}

.action-row {
  display: flex;
  gap: var(--space-3);
  flex-wrap: wrap;
}

.save-btn {
  flex: 1;
  min-width: 180px;
  background: #fff;
  border-color: var(--border);
  color: #000;
}

.save-btn.primary {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.defense .save-btn.primary {
  background: var(--fox-red);
  border-color: var(--fox-red);
}

.tables {
  display: grid;
  gap: var(--space-5);
  margin-top: var(--space-5);
}

.table-card {
  padding: var(--space-5);
  position: relative;
  overflow: hidden;
}

.table-card.offense {
  border-top: 8px solid var(--primary);
}

.table-card.defense {
  border-top: 8px solid var(--fox-red);
}

.table-tools {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
  flex-wrap: wrap;
}

.table-tools h2 {
  margin: 0;
  color: #000;
}

.table-wrap {
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: #fff;
}

table {
  width: 100%;
  table-layout: fixed;
  border-collapse: collapse;
}

th,
td {
  padding: .82rem .72rem;
  border-bottom: 1px solid rgba(40,37,29,.09);
  text-align: left;
  vertical-align: top;
  word-break: break-word;
}

th {
  position: sticky;
  top: 0;
  background: var(--surface-2);
  z-index: 1;
  color: #000;
}

th button {
  border: 0;
  padding: 0;
  background: transparent;
  font: inherit;
  font-weight: 700;
  color: #000;
}

tbody tr:hover {
  background: #faf8f3;
}

tbody tr.editing {
  background: #e7f0ff;
}

.result-cell.green {
  background: rgba(220,239,214,.82);
}

.result-cell.red {
  background: rgba(247,219,219,.82);
}

.result-cell.yellow {
  background: rgba(247,237,198,.88);
}

.result-cell.split-green-red {
  background: linear-gradient(90deg, rgba(220,239,214,.82) 0 50%, rgba(247,219,219,.82) 50% 100%);
}

.result-cell.split-red-green {
  background: linear-gradient(90deg, rgba(247,219,219,.82) 0 50%, rgba(220,239,214,.82) 50% 100%);
}

.pill {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: .2rem .55rem;
  background: #eee;
  font-size: var(--text-sm);
  font-weight: 700;
}

.pill.position {
  background: #eef0f7;
  color: #33406b;
}

.pill.structure {
  background: #e7f4ea;
  color: #19502a;
}

.pill.number {
  background: #f2edf8;
  color: #53306f;
}

.pill.number-66 {
  background: #ffffff;
  color: #53306f;
  border: 1px solid #e0e0e0;
}

.pill.number-76 {
  background: #f0f7ff;
  color: #53306f;
}

.pill.number-65 {
  background: #fff9f0;
  color: #53306f;
}

.pill.number-tempo {
  background: #f7edc6;
  color: #7b5c00;
}

.pill.green-tag {
  background: #e1f0dc;
  color: #1b5c26;
}

.pill.red-tag {
  background: #f8dfdf;
  color: #8d2424;
}

.pill.yellow-tag {
  background: #f7edc6;
  color: #7b5c00;
}

.notes {
  padding: var(--space-5);
  margin-top: var(--space-5);
}

.notes textarea {
  min-height: 110px;
  resize: vertical;
}

.empty {
  padding: var(--space-8);
  text-align: center;
  color: var(--muted);
}

@media (max-width: 1100px) {
  .dual-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 760px) {
  .app {
    padding: var(--space-4);
  }

  .setup,
  .section-card,
  .table-card,
  .notes,
  .topbar {
    padding: var(--space-4);
  }

  .topbar {
    flex-direction: column;
    align-items: stretch;
  }

  .brand-stack {
    align-items: flex-start;
  }

  .button-grid,
  .button-grid.four,
  .button-grid.two-wide,
  .structure-row {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .result-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
</style>
</head>

<body>
<div class="app">

  <section id="setup" class="panel setup">
    <div class="setup-grid">
      <div class="logo-setup"></div>

      <div class="field">
        <label for="opponent">Gegner</label>
        <input id="opponent" type="text" placeholder="Gegner eingeben">
      </div>

      <div class="field">
        <label for="matchDate">Datum</label>
        <input id="matchDate" type="date">
      </div>

      <button id="startBtn" class="start-btn" type="button">
        Start
      </button>
    </div>
  </section>

  <section id="workspace" class="workspace hidden">

    <div class="panel topbar">
      <div class="brand-stack">
        <img
          id="brandLogo"
          src="./logo.png.JPG"
          alt="Logo"
          class="brand-logo"
          width="72"
          height="72"
        >

        <div>
          <h1 id="headline">Statistik</h1>
          <div id="topMeta" class="topbar-meta"></div>
        </div>
      </div>

      <div class="topbar-actions">
        <button id="undoBtn" class="utility-btn undo" type="button" aria-label="Rückgängig">↶</button>
        <button id="pdfBtn" class="utility-btn primary" type="button">Export PDF</button>
      </div>
    </div>

    <div class="dual-grid">

      <section class="panel section-card offense">
        <div class="section-head">
          <h2>Offensive Aktionen</h2>
          <div id="offenseCount" class="entry-count">0 Einträge</div>
        </div>

        <div class="controls">
          <div class="group">
            <h3>Struktur</h3>
            <div id="offenseStructureRow1" class="structure-row"></div>
            <div id="offenseStructureRow2" class="structure-row"></div>
            <div id="offenseStructureRow3" class="structure-row"></div>
          </div>

          <div class="group">
            <h3>Angegriffene Position</h3>
            <div id="offensePositionButtons" class="button-grid"></div>
          </div>

          <div class="group">
            <h3>Ergebnis</h3>
            <div id="offenseResultButtons" class="result-grid"></div>
          </div>

          <div class="group">
            <h3>Zahl</h3>
            <div id="offenseNumberButtons" class="button-grid"></div>
          </div>

          <div class="action-row">
            <button id="offenseResetBtn" class="save-btn" type="button">Auswahl leeren</button>
            <button id="offenseSaveBtn" class="save-btn primary" type="button">Offensive Aktion speichern</button>
          </div>
        </div>
      </section>

      <section class="panel section-card defense">
        <div class="section-head">
          <h2>Defensive Aktionen</h2>
          <div id="defenseCount" class="entry-count">0 Einträge</div>
        </div>

        <div class="controls">
          <div class="group">
            <h3>Angegriffene Position</h3>
            <div class="stack-grid">
              <div id="defensePositionGreenButtons" class="button-grid four"></div>
              <div id="defensePositionRedButtons" class="button-grid four"></div>
            </div>
          </div>

          <div class="group">
            <h3>Abschlussposition</h3>
            <div class="stack-grid">
              <div id="defenseFinishGreenButtons" class="button-grid four"></div>
              <div id="defenseFinishRedButtons" class="button-grid four"></div>
              <div id="defenseFinishSpecialButtons" class="button-grid two-wide"></div>
            </div>
          </div>

          <div class="group">
            <h3>Zahl</h3>
            <div id="defenseNumberButtons" class="button-grid"></div>
          </div>

          <div class="action-row">
            <button id="defenseResetBtn" class="save-btn" type="button">Auswahl leeren</button>
            <button id="defenseSaveBtn" class="save-btn primary" type="button">Defensive Aktion speichern</button>
          </div>
        </div>
      </section>
    </div>

    <div class="tables">
      <section class="panel table-card offense">
        <div class="table-tools">
          <h2>Angriff</h2>
          <div id="offenseSortInfo"></div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:7%">
                  <button type="button" data-table="offense" data-sort="index">#</button>
                </th>
                <th style="width:23%">
                  <button type="button" data-table="offense" data-sort="structure">Struktur</button>
                </th>
                <th style="width:15%">
                  <button type="button" data-table="offense" data-sort="position">Position</button>
                </th>
                <th style="width:23%">
                  <button type="button" data-table="offense" data-sort="result">Ergebnis</button>
                </th>
                <th style="width:15%">
                  <button type="button" data-table="offense" data-sort="number">Zahl</button>
                </th>
              </tr>
            </thead>

            <tbody id="offenseTableBody">
              <tr>
                <td colspan="5" class="empty">
                  Noch keine offensiven Einträge.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="panel table-card defense">
        <div class="table-tools">
          <h2>Abwehr</h2>
          <div id="defenseSortInfo"></div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:7%">
                  <button type="button" data-table="defense" data-sort="index">#</button>
                </th>
                <th style="width:20%">
                  <button type="button" data-table="defense" data-sort="positionLabel">Position</button>
                </th>
                <th style="width:28%">
                  <button type="button" data-table="defense" data-sort="finishPositionLabel">Abschlussposition</button>
                </th>
                <th style="width:15%">
                  <button type="button" data-table="defense" data-sort="number">Zahl</button>
                </th>
              </tr>
            </thead>

            <tbody id="defenseTableBody">
              <tr>
                <td colspan="4" class="empty">
                  Noch keine defensiven Einträge.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <section class="panel notes">
      <label for="notes">Notizen</label>
      <textarea id="notes" placeholder="Notizen zum Spiel eingeben..."></textarea>
    </section>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(() => {

  let pressTimer = null;

  const currentStore = domain => state[domain];

  const clone = value =>
    JSON.parse(JSON.stringify(value));

  const escapeHtml = value =>
    String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  const formatDate = value =>
    new Date(`${value}T00:00:00`)
      .toLocaleDateString("de-DE");

  function setToday() {
    els.matchDate.value =
      new Date().toISOString().split("T")[0];
  }

  function getDefenseResult(selection) {
    const specialFreeThrow =
      selection.finishPosition === "freiwurf" &&
      selection.finishSide === "yellow";

    const specialTechnical =
      selection.finishPosition === "tf" &&
      selection.finishSide === "red";

    if (specialFreeThrow) {
      return {
        result: "freiwurf",
        resultDisplay: "Freiwurf",
        group: "yellow"
      };
    }

    if (specialTechnical) {
      return {
        result: "tf",
        resultDisplay: "TF",
        group: "red"
      };
    }

    const success =
      selection.positionSide === "green" &&
      selection.finishSide === "green";

    return {
      result: success
        ? "defense_success"
        : "defense_fail",

      resultDisplay: success
        ? "Erfolg"
        : "Misserfolg",

      group: success
        ? "green"
        : "red"
    };
  }

  function normalizeNumberValue(value, domain) {
    if (domain !== "defense") {
      return value || "6:6";
    }

    if (Array.isArray(value)) {
      return value;
    }

    if (!value) {
      return [];
    }

    return String(value)
      .split(" + ")
      .filter(Boolean);
  }

  function buildSupabaseRow(domain, payload) {
    return {
      match_opponent: state.meta.opponent,
      match_date: state.meta.matchDate,
      side: domain,
      structure: payload.structure,
      attack_position: payload.position,
      finish_position: payload.finishPosition,
      position_side: payload.positionSide,
      finish_side: payload.finishSide,
      number_relation: payload.number,
      result: payload.result,
      result_display: payload.resultDisplay,
      result_group: payload.group,
      created_order: payload.createdOrder
    };
  }

  function normalizeRow(row, fallback = {}) {
    const domain =
      row.side || fallback.domain || "offense";

    return {
      ...row,
      id: row.id,

      createdOrder:
        row.created_order ??
        fallback.createdOrder,

      structure:
        row.structure ??
        fallback.structure ??
        "",

      position:
        row.attack_position ??
        fallback.position ??
        "",

      finishPosition:
        row.finish_position ??
        fallback.finishPosition ??
        "",

      positionSide:
        row.position_side ??
        fallback.positionSide ??
        "",

      finishSide:
        row.finish_side ??
        fallback.finishSide ??
        "",

      number:
        normalizeNumberValue(
          row.number_relation ??
          fallback.number,
          domain
        ),

      result:
        row.result ??
        fallback.result ??
        "",

      resultDisplay:
        row.result_display ??
        fallback.resultDisplay ??
        "",

      group:
        row.result_group ??
        fallback.group ??
        ""
    };
  }

  async function loadMatchActions() {
    const { data, error } =
      await supabase
        .from("match_actions")
        .select("*")
        .eq("match_opponent", state.meta.opponent)
        .eq("match_date", state.meta.matchDate)
        .order("created_order", {
          ascending: true
        });

    if (error) {
      console.error(error);

      alert(
        error.message ||
        "Fehler beim Laden der Spieldaten."
      );

      return;
    }

    state.offense.entries =
      data
        .filter(row => row.side === "offense")
        .map(row =>
          normalizeRow(row, {
            domain: "offense"
          })
        );

    state.defense.entries =
      data
        .filter(row => row.side === "defense")
        .map(row => {
          const normalized =
            normalizeRow(row, {
              domain: "defense"
            });

          if (!normalized.result) {
            const success =
              normalized.positionSide === "green" &&
              normalized.finishSide === "green";

            normalized.result =
              success
                ? "defense_success"
                : "defense_fail";

            normalized.resultDisplay =
              success
                ? "Erfolg"
                : normalized.finishPosition === "freiwurf"
                  ? "Freiwurf"
                  : normalized.finishPosition === "tf"
                    ? "TF"
                    : "Misserfolg";

            normalized.group =
              normalized.finishPosition === "freiwurf"
                ? "yellow"
                : success
                  ? "green"
                  : "red";
          }

          return normalized;
        });
  }

  async function insertEntry(domain, payload) {
    const { data, error } =
      await supabase
        .from("match_actions")
        .insert(buildSupabaseRow(domain, payload))
        .select("*")
        .single();

    if (error) {
      throw error;
    }

    return normalizeRow(data, {
      ...payload,
      domain
    });
  }

  async function updateEntry(id, domain, payload) {
    const { data, error } =
      await supabase
        .from("match_actions")
        .update(buildSupabaseRow(domain, payload))
        .eq("id", id)
        .select("*")
        .single();

    if (error) {
      throw error;
    }

    return normalizeRow(data, {
      ...payload,
      domain
    });
  }

  async function deleteEntry(id) {
    const { error } =
      await supabase
        .from("match_actions")
        .delete()
        .eq("id", id);

    if (error) {
      throw error;
    }
  }

  function renderButtons(
    mount,
    items,
    type,
    domain,
    variant = ""
  ) {
    mount.innerHTML = "";

    items.forEach(item => {
      const value =
        typeof item === "string"
          ? item
          : item.key;

      const label =
        typeof item === "string"
          ? item
          : item.display;

      const itemVariant =
        typeof item === "string"
          ? variant
          : item.variant || variant;

      const group =
        typeof item === "string"
          ? ""
          : item.group || "";

      const button =
        document.createElement("button");

      button.type = "button";
      button.dataset.value = value;
      button.dataset.type = type;
      button.dataset.domain = domain;

      if (itemVariant) {
        button.dataset.variant = itemVariant;
      }

      button.className =
        type === "result"
          ? `result-btn ${group}`
          : `choice-btn ${
              itemVariant
                ? `${itemVariant}-variant`
                : ""
            }`;

      button.textContent = label;

      button.addEventListener("click", () => {
        handleSelection(
          domain,
          type,
          value,
          group,
          label,
          itemVariant
        );
      });

      mount.appendChild(button);
    });
  }

  function handleSelection(
    domain,
    type,
    value,
    group,
    display,
    variant
  ) {
    const store = currentStore(domain);
    const selection = store.selection;

    if (type === "structure") {
      if (!Array.isArray(selection.structure)) {
        selection.structure = selection.structure
          ? [selection.structure]
          : [];
      }

      if (selection.structure.includes(value)) {
        selection.structure =
          selection.structure.filter(
            item => item !== value
          );
      } else if (selection.structure.length < 2) {
        selection.structure.push(value);
      } else {
        alert(
          "Es können höchstens zwei Strukturen ausgewählt werden."
        );
      }
    }

    if (type === "position") {
      selection.position = value;

      if (domain === "defense") {
        selection.positionSide = variant;
      }
    }

    if (type === "finishPosition") {
      selection.finishPosition = value;

      if (domain === "defense") {
        selection.finishSide = variant;
      }
    }

    if (type === "number") {
      if (domain === "defense") {
        if (!Array.isArray(selection.number)) {
          selection.number =
            selection.number
              ? [selection.number]
              : [];
        }

        if (selection.number.includes(value)) {
          selection.number =
            selection.number.filter(
              item => item !== value
            );
        } else if (selection.number.length < 2) {
          selection.number.push(value);
        } else {
          alert(
            "Es können höchstens zwei Werte ausgewählt werden."
          );
        }
      } else {
        selection.number = value;
      }
    }

    if (type === "result") {
      selection.result = value;
      selection.resultDisplay = display;
      selection.group = group;
    }

    if (domain === "defense") {
      const result = getDefenseResult(selection);

      selection.result = result.result;
      selection.resultDisplay = result.resultDisplay;
      selection.group = result.group;
    }

    updateSelectedButtons(domain);
  }

  function updateSelectedButtons(domain) {
    const store = currentStore(domain);
    const selection = store.selection;

    document
      .querySelectorAll(
        `button[data-domain="${domain}"]`
      )
      .forEach(button => {
        const type = button.dataset.type;
        const value = button.dataset.value;
        const variant =
          button.dataset.variant || "";

        let selected = false;

        if (type === "structure") {
          const structures =
            Array.isArray(selection.structure)
              ? selection.structure
              : selection.structure
                ? [selection.structure]
                : [];

          selected = structures.includes(value);
        }

        if (type === "position") {
          selected =
            value === selection.position &&
            (
              domain !== "defense" ||
              variant === selection.positionSide
            );
        }

        if (type === "finishPosition") {
          selected =
            value === selection.finishPosition &&
            variant === selection.finishSide;
        }

        if (type === "number") {
          if (domain === "defense") {
            const numbers =
              Array.isArray(selection.number)
                ? selection.number
                : selection.number
                  ? [selection.number]
                  : [];

            selected = numbers.includes(value);
          } else {
            selected = value === selection.number;
          }
        }

        if (type === "result") {
          selected = value === selection.result;
        }

        button.classList.toggle(
          "selected",
          selected
        );
      });
  }

  function clearSelection(domain) {
    const store = currentStore(domain);

    store.selection =
      defaultSelection(domain);

    store.editingId = null;

    updateSelectedButtons(domain);
    renderTable(domain);
  }
  function validate(domain) {
    const selection =
      currentStore(domain).selection;

    const structures =
      Array.isArray(selection.structure)
        ? selection.structure
        : selection.structure
          ? [selection.structure]
          : [];

    if (
      domain === "offense" &&
      (
        structures.length === 0 ||
        !selection.number ||
        !selection.result
      )
    ) {
      alert(
        "Bitte mindestens eine Struktur, Zahl und Ergebnis auswählen."
      );
      return false;
    }

    const defenseNumbers =
      Array.isArray(selection.number)
        ? selection.number
        : selection.number
          ? [selection.number]
          : [];

    if (
      domain === "defense" &&
      (
        !selection.position ||
        !selection.finishPosition ||
        !selection.positionSide ||
        !selection.finishSide ||
        defenseNumbers.length === 0
      )
    ) {
      alert(
        "Bitte angegriffene Position, Abschlussposition und Zahl auswählen."
      );
      return false;
    }

    return true;
  }

  function createPayload(domain) {
    const selection =
      currentStore(domain).selection;

    const store = currentStore(domain);

    const existing =
      store.entries.find(
        entry => entry.id === store.editingId
      );

    const structures =
      Array.isArray(selection.structure)
        ? selection.structure
        : selection.structure
          ? [selection.structure]
          : [];

    let result = selection.result;
    let resultDisplay = selection.resultDisplay;
    let group = selection.group;

    if (domain === "defense") {
      const defenseResult =
        getDefenseResult(selection);

      result = defenseResult.result;
      resultDisplay =
        defenseResult.resultDisplay;
      group = defenseResult.group;
    }

    let numberValue;

    if (domain === "defense") {
      const numbers =
        Array.isArray(selection.number)
          ? selection.number
          : selection.number
            ? [selection.number]
            : [];

      numberValue = numbers.join(" + ");
    } else {
      numberValue = selection.number || "6:6";
    }

    return {
      structure:
        domain === "offense"
          ? structures.join(" + ")
          : "",

      position: selection.position,

      finishPosition:
        domain === "defense"
          ? selection.finishPosition
          : "",

      positionSide:
        domain === "defense"
          ? selection.positionSide
          : "",

      finishSide:
        domain === "defense"
          ? selection.finishSide
          : "",

      number: numberValue,
      result,
      resultDisplay,
      group,

      createdOrder:
        existing
          ? existing.createdOrder
          : store.entries.length + 1
    };
  }

  async function saveEntry(domain) {
    if (!validate(domain)) {
      return;
    }

    const store = currentStore(domain);
    const payload = createPayload(domain);
    const editing = Boolean(store.editingId);

    try {
      if (editing) {
        const existing =
          store.entries.find(
            entry => entry.id === store.editingId
          );

        const before = clone(existing);

        const updated =
          await updateEntry(
            existing.id,
            domain,
            payload
          );

        const index =
          store.entries.findIndex(
            entry => entry.id === existing.id
          );

        store.entries[index] = updated;

        state.undoStack.push({
          type: "edit",
          domain,
          before,
          after: clone(updated)
        });
      } else {
        const inserted =
          await insertEntry(domain, payload);

        store.entries.push(inserted);

        state.undoStack.push({
          type: "add",
          domain,
          entry: clone(inserted)
        });
      }

      clearSelection(domain);
      renderTable("offense");
      renderTable("defense");
    } catch (error) {
      console.error(error);

      alert(
        error.message ||
        "Fehler beim Speichern."
      );
    }
  }

  async function undoLast() {
    const action = state.undoStack.pop();

    if (!action) {
      alert(
        "Es gibt keine Aktion zum Rückgängigmachen."
      );
      return;
    }

    const store =
      currentStore(action.domain);

    try {
      if (action.type === "add") {
        await deleteEntry(action.entry.id);

        store.entries =
          store.entries.filter(
            entry => entry.id !== action.entry.id
          );
      }

      if (action.type === "edit") {
        const before = action.before;

        const restoredPayload = {
          structure: before.structure || "",
          position: before.position || "",
          finishPosition: before.finishPosition || "",
          positionSide: before.positionSide || "",
          finishSide: before.finishSide || "",
          number: Array.isArray(before.number)
            ? before.number.join(" + ")
            : before.number || "6:6",
          result: before.result || "",
          resultDisplay: before.resultDisplay || "",
          group: before.group || "",
          createdOrder: before.createdOrder
        };

        const restored =
          await updateEntry(
            before.id,
            action.domain,
            restoredPayload
          );

        const index =
          store.entries.findIndex(
            entry => entry.id === before.id
          );

        if (index !== -1) {
          store.entries[index] = restored;
        }
      }

      clearSelection(action.domain);
      renderTable("offense");
      renderTable("defense");
    } catch (error) {
      console.error(error);

      alert(
        error.message ||
        "Fehler beim Rückgängigmachen."
      );
    }
  }

  function getSortValue(row, key) {
    if (key === "index") {
      return Number(row.createdOrder) || 0;
    }

    if (key === "structure") {
      return row.structure || "";
    }

    if (key === "position") {
      return row.position || "";
    }

    if (key === "positionLabel") {
      return `${row.positionSide || ""} ${row.position || ""}`;
    }

    if (key === "finishPositionLabel") {
      return `${row.finishSide || ""} ${row.finishPosition || ""}`;
    }

    if (key === "number") {
      return Array.isArray(row.number)
        ? row.number.join(" + ")
        : row.number || "";
    }

    if (key === "result") {
      return row.resultDisplay || row.result || "";
    }

    return "";
  }

  function sortEntries(domain) {
    const store = currentStore(domain);
    const rows = [...store.entries];
    const { key, dir } = store.sort;
    const factor = dir === "asc" ? 1 : -1;

    rows.sort((a, b) => {
      const valueA = getSortValue(a, key);
      const valueB = getSortValue(b, key);

      let comparison;

      if (
        typeof valueA === "number" &&
        typeof valueB === "number"
      ) {
        comparison = valueA - valueB;
      } else {
        comparison =
          String(valueA).localeCompare(
            String(valueB),
            "de"
          );
      }

      if (comparison === 0) {
        comparison =
          (Number(a.createdOrder) || 0) -
          (Number(b.createdOrder) || 0);
      }

      return comparison * factor;
    });

    return rows;
  }

  function setSort(domain, key) {
    const store = currentStore(domain);

    if (store.sort.key === key) {
      store.sort.dir =
        store.sort.dir === "asc"
          ? "desc"
          : "asc";
    } else {
      store.sort.key = key;
      store.sort.dir =
        key === "index"
          ? "desc"
          : "asc";
    }

    renderTable(domain);
  }

  function getNumberClass(number) {
    if (number === "6:6") {
      return "number-66";
    }

    if (number === "7:6") {
      return "number-76";
    }

    if (number === "6:5") {
      return "number-65";
    }

    if (number === "Tempo") {
      return "number-tempo";
    }

    return "number";
  }

  function getNumberDisplay(row) {
    if (Array.isArray(row.number)) {
      return row.number
        .map(number => {
          return `
            <span class="pill ${getNumberClass(number)}">
              ${escapeHtml(number)}
            </span>
          `;
        })
        .join(" ");
    }

    if (row.number) {
      return `
        <span class="pill ${
          getNumberClass(row.number)
        }">
          ${escapeHtml(row.number)}
        </span>
      `;
    }

    return "—";
  }

  function renderStructureDisplay(value) {
    if (!value) {
      return "—";
    }

    return String(value)
      .split(" + ")
      .filter(Boolean)
      .map(structure => {
        return `
          <span class="pill structure">
            ${escapeHtml(structure)}
          </span>
        `;
      })
      .join(" ");
  }

  function renderTable(domain) {
    const store = currentStore(domain);
    const rows = sortEntries(domain);

    const body =
      els[`${domain}TableBody`];

    const countElement =
      els[`${domain}Count`];

    const sortInfo =
      els[`${domain}SortInfo`];

    countElement.textContent =
      `${store.entries.length} Einträge`;

    sortInfo.textContent =
      `${store.sort.key} ${
        store.sort.dir === "asc"
          ? "↑"
          : "↓"
      }`;

    if (!rows.length) {
      body.innerHTML = `
        <tr>
          <td
            colspan="${domain === "offense" ? 5 : 4}"
            class="empty"
          >
            Noch keine ${
              domain === "offense"
                ? "offensiven"
                : "defensiven"
            } Einträge.
          </td>
        </tr>
      `;

      return;
    }

    if (domain === "offense") {
      body.innerHTML = rows
        .map(row => `
          <tr
            data-domain="offense"
            data-id="${row.id}"
            class="${
              store.editingId === row.id
                ? "editing"
                : ""
            }"
          >
            <td>
              ${escapeHtml(
                row.createdOrder ?? "—"
              )}
            </td>

            <td>
              ${renderStructureDisplay(
                row.structure
              )}
            </td>

            <td>
              ${
                row.position
                  ? `
                    <span class="pill position">
                      ${escapeHtml(row.position)}
                    </span>
                  `
                  : "—"
              }
            </td>

            <td class="result-cell ${
              row.group || ""
            }">
              ${escapeHtml(
                row.resultDisplay ||
                row.result ||
                ""
              )}
            </td>

            <td>
              ${getNumberDisplay(row)}
            </td>
          </tr>
        `)
        .join("");
    } else {
      body.innerHTML = rows
        .map(row => `
          <tr
            data-domain="defense"
            data-id="${row.id}"
            class="${
              store.editingId === row.id
                ? "editing"
                : ""
            }"
          >
            <td>
              ${escapeHtml(
                row.createdOrder ?? "—"
              )}
            </td>

            <td>
              ${
                row.position
                  ? `
                    <span class="pill ${
                      row.positionSide === "green"
                        ? "green-tag"
                        : "red-tag"
                    }">
                      ${escapeHtml(row.position)}
                    </span>
                  `
                  : "—"
              }
            </td>

            <td>
              ${
                row.finishPosition
                  ? `
                    <span class="pill ${
                      row.finishSide === "green"
                        ? "green-tag"
                        : row.finishSide === "yellow"
                          ? "yellow-tag"
                          : "red-tag"
                    }">
                      ${escapeHtml(
                        row.finishPosition === "freiwurf"
                          ? "Freiwurf"
                          : row.finishPosition === "tf"
                            ? "TF"
                            : row.finishPosition
                      )}
                    </span>
                  `
                  : "—"
              }
            </td>

            <td>
              ${getNumberDisplay(row)}
            </td>
          </tr>
        `)
        .join("");
    }

    addLongPressListeners(domain);
  }

  function addLongPressListeners(domain) {
    const body =
      els[`${domain}TableBody`];

    body
      .querySelectorAll("tr[data-id]")
      .forEach(row => {
        const id = row.dataset.id;

        row.addEventListener(
          "mousedown",
          () => startLongPress(domain, id)
        );

        row.addEventListener(
          "mouseup",
          () => {
            if (!longPressFired) {
              stopLongPress();
            }
          }
        );

        row.addEventListener(
          "mouseleave",
          stopLongPress
        );

        row.addEventListener(
          "touchstart",
          event => {
            startLongPress(domain, id);
            event.preventDefault();
          },
          { passive: false }
        );

        row.addEventListener(
          "touchend",
          event => {
            stopLongPress();
            event.preventDefault();
          },
          { passive: false }
        );

        row.addEventListener(
          "touchcancel",
          stopLongPress
        );
      });
  }

  function startLongPress(domain, id) {
    stopLongPress();
    longPressFired = false;

    pressTimer = setTimeout(() => {
      longPressFired = true;
      loadForEdit(domain, id);
    }, 550);
  }

  function stopLongPress() {
    clearTimeout(pressTimer);
  }

  function loadForEdit(domain, id) {
    const store = currentStore(domain);

    const entry =
      store.entries.find(
        row => String(row.id) === String(id)
      );

    if (!entry) {
      return;
    }

    store.editingId = entry.id;

    const structures =
      entry.structure
        ? String(entry.structure)
            .split(" + ")
            .filter(Boolean)
        : [];

    const numbers =
      domain === "defense"
        ? normalizeNumberValue(
            entry.number,
            "defense"
          )
        : entry.number || "6:6";

    store.selection = {
      structure: structures,
      position: entry.position || "",
      finishPosition:
        entry.finishPosition || "",
      positionSide:
        entry.positionSide || "",
      finishSide:
        entry.finishSide || "",
      number: numbers,
      result: entry.result || "",
      resultDisplay:
        entry.resultDisplay || "",
      group: entry.group || ""
    };

    updateSelectedButtons(domain);
    renderTable(domain);

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  function applyResultColor(data) {
    if (
      data.section !== "body" ||
      data.column.index !== 3
    ) {
      return;
    }

    const value =
      String(data.cell.raw || "");

    if (value === "Freiwurf") {
      data.cell.styles.fillColor =
        [247, 237, 198];
    } else if (value === "TF") {
      data.cell.styles.fillColor =
        [247, 219, 219];
    } else if (value === "gute Chance - Tor") {
      data.cell.styles.fillColor =
        [220, 239, 214];
    } else if (
      value === "schlechte Chance - kein Tor"
    ) {
      data.cell.styles.fillColor =
        [220, 239, 214];
    } else if (
      value === "gute Chance - kein Tor"
    ) {
      data.cell.styles.fillColor =
        [220, 239, 214];
    } else if (
      value === "schlechte Chance - Tor"
    ) {
      data.cell.styles.fillColor =
        [247, 219, 219];
    }
  }

  function getNumberFillColor(number) {
    if (number === "6:6") {
      return [255, 255, 255];
    }

    if (number === "7:6") {
      return [240, 247, 255];
    }

    if (number === "6:5") {
      return [255, 249, 240];
    }

    if (number === "Tempo") {
      return [247, 237, 198];
    }

    return [255, 255, 255];
  }

  function applyNumberColor(data) {
    if (data.section !== "body") {
      return;
    }

    if (
      data.table.section === "Angriff" &&
      data.column.index === 4
    ) {
      data.cell.styles.fillColor =
        getNumberFillColor(
          String(data.cell.raw || "")
        );
    }

    if (
      data.table.section === "Abwehr" &&
      data.column.index === 3
    ) {
      data.cell.styles.fillColor =
        getNumberFillColor(
          String(data.cell.raw || "")
        );
    }
  }
    function exportPdf() {
    if (
      !window.jspdf ||
      !window.jspdf.jsPDF
    ) {
      alert(
        "Der PDF-Export konnte nicht geladen werden. " +
        "Bitte öffne die App einmal mit Internetverbindung " +
        "und versuche es erneut."
      );
      return;
    }

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF({
      orientation: "landscape",
      unit: "mm",
      format: "a4"
    });

    if (typeof doc.autoTable !== "function") {
      alert(
        "Das PDF-Tabellenmodul konnte nicht geladen werden. " +
        "Bitte öffne die App mit Internetverbindung " +
        "und versuche es erneut."
      );
      return;
    }

    doc.setFontSize(16);

    doc.text(
      `Kollektive Statistik vs ${state.meta.opponent}`,
      14,
      14
    );

    doc.setFontSize(10);

    doc.text(
      `Datum: ${formatDate(state.meta.matchDate)}`,
      14,
      21
    );

    const offenseRows =
      sortEntries("offense").map(row => [
        row.createdOrder || "",
        row.structure || "",
        row.position || "",
        row.resultDisplay || row.result || "",
        Array.isArray(row.number)
          ? row.number.join(" + ")
          : row.number || ""
      ]);

    const defenseRows =
      sortEntries("defense").map(row => [
        row.createdOrder || "",
        row.position || "",
        row.finishPosition === "freiwurf"
          ? "Freiwurf"
          : row.finishPosition === "tf"
            ? "TF"
            : row.finishPosition || "",
        Array.isArray(row.number)
          ? row.number.join(" + ")
          : row.number || ""
      ]);

    doc.setFontSize(12);
    doc.text("Angriff", 14, 30);

    doc.autoTable({
      head: [[
        "#",
        "Struktur",
        "Position",
        "Ergebnis",
        "Zahl"
      ]],

      body: offenseRows.length
        ? offenseRows
        : [["", "Keine Einträge", "", "", ""]],

      startY: 33,
      theme: "grid",

      styles: {
        fontSize: 7.5,
        cellPadding: 2,
        lineWidth: .2,
        lineColor: [140, 140, 140]
      },

      headStyles: {
        fillColor: [230, 242, 241],
        textColor: 20
      },

      didParseCell: data => {
        applyResultColor(data);
        applyNumberColor(data);
      }
    });

    let nextY =
      doc.lastAutoTable.finalY + 10;

    if (nextY > 170) {
      doc.addPage();
      nextY = 18;
    }

    doc.setFontSize(12);
    doc.text("Abwehr", 14, nextY);

    doc.autoTable({
      head: [[
        "#",
        "Position",
        "Abschlussposition",
        "Zahl"
      ]],

      body: defenseRows.length
        ? defenseRows
        : [["", "Keine Einträge", "", ""]],

      startY: nextY + 3,
      theme: "grid",

      styles: {
        fontSize: 7.5,
        cellPadding: 2,
        lineWidth: .2,
        lineColor: [140, 140, 140]
      },

      headStyles: {
        fillColor: [248, 232, 233],
        textColor: 20
      },

      didParseCell: data => {
        if (data.section !== "body") {
          return;
        }

        if (data.column.index === 1) {
          const row =
            sortEntries("defense")[data.row.index];

          const positionSide =
            row?.positionSide || "";

          if (positionSide === "green") {
            data.cell.styles.fillColor =
              [225, 240, 220];
          } else if (positionSide === "red") {
            data.cell.styles.fillColor =
              [248, 223, 223];
          }
        }

        if (data.column.index === 2) {
          const row =
            sortEntries("defense")[data.row.index];

          const finishSide =
            row?.finishSide || "";

          if (finishSide === "green") {
            data.cell.styles.fillColor =
              [225, 240, 220];
          } else if (finishSide === "red") {
            data.cell.styles.fillColor =
              [248, 223, 223];
          } else if (finishSide === "yellow") {
            data.cell.styles.fillColor =
              [247, 237, 198];
          }
        }

        applyNumberColor(data);
      }
    });

    const noteText =
      els.notes.value.trim();

    if (noteText) {
      let noteY =
        doc.lastAutoTable.finalY + 10;

      if (noteY > 180) {
        doc.addPage();
        noteY = 20;
      }

      doc.setFontSize(11);
      doc.text("Notizen:", 14, noteY);

      doc.setFontSize(10);

      const lines =
        doc.splitTextToSize(
          noteText,
          255
        );

      doc.text(
        lines,
        14,
        noteY + 6
      );
    }

    const safeOpponent =
      state.meta.opponent
        .replace(/[^\wäöüÄÖÜß-]+/g, "_")
        .replace(/^_+|_+$/g, "");

    doc.save(
      `Kollektive_Statistik_vs_${
        safeOpponent || "Gegner"
      }.pdf`
    );
  }

  function startApp() {
    const opponent =
      els.opponent.value.trim();

    const matchDate =
      els.matchDate.value;

    if (!opponent || !matchDate) {
      alert(
        "Bitte Gegner und Datum eintragen."
      );
      return;
    }

    state.meta = {
      opponent,
      matchDate
    };

    els.headline.textContent =
      `Statistik vs ${opponent}`;

    els.topMeta.textContent =
      formatDate(matchDate);

    els.setup.classList.add("hidden");
    els.workspace.classList.remove("hidden");

    loadMatchActions().then(() => {
      renderTable("offense");
      renderTable("defense");
      updateSelectedButtons("offense");
      updateSelectedButtons("defense");
    });
  }

  document
    .querySelectorAll("th button[data-table]")
    .forEach(button => {
      button.addEventListener("click", () => {
        setSort(
          button.dataset.table,
          button.dataset.sort
        );
      });
    });

  els.startBtn.addEventListener(
    "click",
    startApp
  );

  els.undoBtn.addEventListener(
    "click",
    undoLast
  );

  els.pdfBtn.addEventListener(
    "click",
    exportPdf
  );

  els.offenseSaveBtn.addEventListener(
    "click",
    () => saveEntry("offense")
  );

  els.defenseSaveBtn.addEventListener(
    "click",
    () => saveEntry("defense")
  );

  els.offenseResetBtn.addEventListener(
    "click",
    () => clearSelection("offense")
  );

  els.defenseResetBtn.addEventListener(
    "click",
    () => clearSelection("defense")
  );

  offenseStructureRows.forEach(
    (row, index) => {
      renderButtons(
        els[`offenseStructureRow${index + 1}`],
        row,
        "structure",
        "offense"
      );
    }
  );

  renderButtons(
    els.offensePositionButtons,
    positionOptions,
    "position",
    "offense"
  );

  renderButtons(
    els.offenseResultButtons,
    offenseResults,
    "result",
    "offense"
  );

  renderButtons(
    els.offenseNumberButtons,
    offenseNumberOptions,
    "number",
    "offense"
  );

  renderButtons(
    els.defensePositionGreenButtons,
    positionOptions,
    "position",
    "defense",
    "green"
  );

  renderButtons(
    els.defensePositionRedButtons,
    positionOptions,
    "position",
    "defense",
    "red"
  );

  renderButtons(
    els.defenseFinishGreenButtons,
    defenseFinishOptions,
    "finishPosition",
    "defense",
    "green"
  );

  renderButtons(
    els.defenseFinishRedButtons,
    defenseFinishOptions,
    "finishPosition",
    "defense",
    "red"
  );

  renderButtons(
    els.defenseFinishSpecialButtons,
    defenseFinishSpecialOptions,
    "finishPosition",
    "defense"
  );

  renderButtons(
    els.defenseNumberButtons,
    defenseNumberOptions,
    "number",
    "defense"
  );

  updateSelectedButtons("offense");
  updateSelectedButtons("defense");
  setToday();
})();
</script>

</body>
</html>
