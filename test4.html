<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handball Kollektiv - Anzeige</title>
<style>
:root{--primary:#0d5b1f;--primary2:#1e7a31;--red:#d91f26;--text:#1f261f;--muted:#647064;--bg:#f3f5f0;--surface:#fff;--border:rgba(18,35,20,.12);--radius:1rem;--space:1.25rem}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{min-height:100vh;font-family:Arial,sans-serif;color:#111;background:linear-gradient(180deg,rgba(13,91,31,.05),var(--bg))}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{max-width:1360px;margin:auto;padding:var(--space)}.panel{border:1px solid var(--border);border-radius:var(--radius);background:rgba(255,255,255,.95);box-shadow:0 12px 28px rgba(9,27,12,.08)}
.setup{max-width:760px;margin:6vh auto 0;padding:4rem 2rem}.setup-grid{display:grid;gap:var(--space);justify-items:center}.logo-setup{width:100%;height:280px;background:url("logo.png.JPG") center/contain no-repeat;opacity:.8}.field{text-align:center}.field label{display:block;font-weight:700;margin-bottom:.5rem}.field input{width:min(100%,360px);padding:1rem;border:1px solid var(--border);border-radius:.8rem;background:#fff}.start-btn{min-height:52px;min-width:160px;border:0;border-radius:.8rem;background:linear-gradient(90deg,var(--primary),var(--primary2));color:#fff;font-weight:700}
.workspace{margin-top:var(--space)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:var(--space);padding:var(--space);margin-bottom:var(--space)}.brand-stack{display:flex;align-items:center;gap:var(--space)}.brand-logo{width:92px;height:92px;object-fit:contain;border-radius:1rem;background:#fff;padding:8px}.topbar h1{margin:0;font-size:1.6rem}.topbar-meta{color:var(--muted);margin-top:.4rem}.utility-btn{padding:.8rem 1rem;border:1px solid var(--border);border-radius:.8rem;background:#fff}.utility-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.tables{display:grid;gap:var(--space)}.table-card{padding:var(--space);overflow:visible}.offense{border-top:8px solid var(--primary)}.defense{border-top:8px solid var(--red)}.table-tools{display:grid;grid-template-columns:1fr auto;align-items:center;gap:1rem;margin-bottom:1rem}.table-tools h2{margin:0;font-size:1.3rem}.table-controls{display:flex;align-items:center;justify-content:flex-end;gap:.75rem;flex-wrap:wrap}.entry-count{padding:.35rem .75rem;border-radius:999px;font-weight:700;background:#eef2ea}.sort-info{color:var(--muted);font-size:.9rem;font-weight:700}.sort-info::before{content:"Sortierung: ";font-weight:400}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff}table{width:100%;table-layout:fixed;border-collapse:collapse}th,td{padding:.8rem .7rem;border-bottom:1px solid rgba(40,37,29,.09);text-align:left;vertical-align:top;word-break:break-word}th{background:#eef2ea}th button{background:transparent;border:0;padding:0;font-weight:700}tbody tr:hover{background:#faf8f3}.empty{text-align:center;color:var(--muted);padding:2rem}.pill{display:inline-flex;border-radius:999px;padding:.2rem .55rem;background:#eee;font-weight:700}.structure{background:#e7f4ea;color:#19502a}.position{background:#eef0f7;color:#33406b}.number{background:#f2edf8;color:#53306f}.green-tag{background:#e1f0dc;color:#1b5c26}.red-tag{background:#f8dfdf;color:#8d2424}.yellow-tag{background:#f7edc6;color:#7b5c00}
.filter-box{min-width:min(100%,310px);position:relative}.filter-toggle{min-height:42px;padding:.55rem .85rem;border:1px solid var(--border);border-radius:999px;background:#fff;font-weight:700}.filter-summary{color:var(--muted);font-size:.88rem;font-weight:400}.filter-menu{display:none;position:absolute;z-index:20;top:calc(100% + .45rem);right:0;width:min(560px,calc(100vw - 3rem));max-height:60vh;overflow:auto;padding:.8rem;border:1px solid var(--border);border-radius:var(--radius);background:#fff;box-shadow:0 12px 30px rgba(9,27,12,.16)}.filter-box.open .filter-menu{display:grid;gap:.7rem}.filter-menu-header{display:flex;justify-content:space-between;padding-bottom:.55rem;border-bottom:1px solid var(--border)}.filter-menu-clear{border:0;background:transparent;color:var(--primary);font-weight:700}.filter-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.75rem}.filter-group{display:grid;gap:.35rem}.filter-group-title{color:var(--muted);font-size:.78rem;font-weight:700;text-transform:uppercase}.filter-options{display:grid;gap:.25rem}.filter-option{display:flex;gap:.4rem;padding:.35rem;font-size:.88rem}.filter-tags{display:flex;flex-wrap:wrap;gap:.3rem}.filter-tag{display:inline-flex;gap:.25rem;padding:.2rem .5rem;border-radius:999px;background:#eef2ea;font-size:.78rem}.filter-tag button{border:0;background:transparent;font-weight:700}
.quote-chart{margin-top:var(--space);padding:var(--space);border-top:1px solid var(--border)}.quote-chart h3{margin:0 0 1rem;font-size:1.2rem}.court-row{display:flex;height:140px;border:2px solid #111;border-radius:8px;overflow:hidden;background:#fff;position:relative}.court-section{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid #ccc}.court-section:last-child{border-right:0}.court-section.empty{background:#f5f5f5}.court-section .section-number{position:absolute;top:4px;color:#666;font-size:.7rem;font-weight:700}.court-section .quote{font-size:1.15rem;font-weight:800}.court-section .detail{margin-top:2px;color:#555;font-size:.75rem}.court-section .bar{position:absolute;left:0;right:0;bottom:0;height:6px}.court-lines{position:absolute;inset:0;pointer-events:none}.goal-area{position:absolute;left:10%;right:10%;bottom:0;height:28%;border:2px solid #111;border-bottom:0}.nine-meter{position:absolute;left:5%;right:5%;bottom:28%;height:2px;background:#111}
@media(max-width:760px){.app{padding:.8rem}.setup,.table-card,.topbar{padding:1rem}.topbar{flex-direction:column;align-items:stretch}.table-tools{grid-template-columns:1fr}.table-controls{justify-content:flex-start}.filter-menu{position:fixed;right:1rem;bottom:1rem;top:auto;width:calc(100vw - 2rem)}}
</style>
</head>
<body>
<div class="app">
<section id="setup" class="panel setup"><div class="setup-grid"><div class="logo-setup"></div><div class="field"><label for="opponent">Gegner</label><input id="opponent" type="text" placeholder="Gegner eingeben"></div><div class="field"><label for="matchDate">Datum</label><input id="matchDate" type="date"></div><button id="startBtn" class="start-btn" type="button">Start</button></div></section>
<section id="workspace" class="workspace hidden">
<div class="panel topbar"><div class="brand-stack"><img id="brandLogo" src="./logo.png.JPG" alt="Logo" class="brand-logo"><div><h1 id="headline">Anzeige</h1><div id="topMeta" class="topbar-meta"></div></div></div><div><button id="pdfBtn" class="utility-btn primary" type="button">Export PDF</button></div></div>
<div class="tables">
<section class="panel table-card offense"><div class="table-tools"><h2>Offensive Aktionen</h2><div class="table-controls"><div class="entry-count" id="offenseCount">0 Einträge</div><div class="filter-box" id="offenseFilterBox"><button id="offenseFilterToggle" class="filter-toggle" type="button">Filter <span id="offenseFilterSummary" class="filter-summary">keine Auswahl</span></button><div id="offenseFilterMenu" class="filter-menu"><div class="filter-menu-header"><strong>Filter auswählen</strong><button id="offenseFilterReset" class="filter-menu-clear" type="button">Zurücksetzen</button></div><div id="offenseFilterTags" class="filter-tags"></div><div id="offenseFilterControls" class="filter-groups"></div></div></div><div id="offenseSortInfo" class="sort-info"></div></div></div><div class="table-wrap"><table><thead><tr><th style="width:7%"><button data-table="offense" data-sort="index" type="button">#</button></th><th style="width:21%"><button data-table="offense" data-sort="structure" type="button">Struktur</button></th><th style="width:13%"><button data-table="offense" data-sort="position" type="button">angegriffene Position</button></th><th style="width:13%"><button data-table="offense" data-sort="half" type="button">Halbzeit</button></th><th style="width:22%"><button data-table="offense" data-sort="result" type="button">Ergebnis</button></th><th style="width:13%"><button data-table="offense" data-sort="number" type="button">Zahl</button></th></tr></thead><tbody id="offenseTableBody"></tbody></table></div></section>
<section class="panel table-card defense"><div class="table-tools"><h2>Defensive Aktionen</h2><div class="table-controls"><div class="entry-count" id="defenseCount">0 Einträge</div><div class="filter-box" id="defenseFilterBox"><button id="defenseFilterToggle" class="filter-toggle" type="button">Filter <span id="defenseFilterSummary" class="filter-summary">keine Auswahl</span></button><div id="defenseFilterMenu" class="filter-menu"><div class="filter-menu-header"><strong>Filter auswählen</strong><button id="defenseFilterReset" class="filter-menu-clear" type="button">Zurücksetzen</button></div><div id="defenseFilterTags" class="filter-tags"></div><div id="defenseFilterControls" class="filter-groups"></div></div></div><div id="defenseSortInfo" class="sort-info"></div></div></div><div class="table-wrap"><table><thead><tr><th style="width:7%"><button data-table="defense" data-sort="index" type="button">#</button></th><th style="width:18%"><button data-table="defense" data-sort="positionLabel" type="button">angegriffene Position</button></th><th style="width:22%"><button data-table="defense" data-sort="finishPositionLabel" type="button">Abschlussposition</button></th><th style="width:13%"><button data-table="defense" data-sort="half" type="button">Halbzeit</button></th><th style="width:13%"><button data-table="defense" data-sort="number" type="button">Zahl</button></th></tr></thead><tbody id="defenseTableBody"></tbody></table></div>
<div class="quote-chart"><h3>Zweikampfquote nach angegriffener Position</h3><div class="court-row"><div class="court-section empty" style="flex:0 0 5%"><span class="section-number">1</span></div><div class="court-section" id="pos2" style="flex:0 0 22.5%"><span class="section-number">2</span><span class="quote">—</span><span class="detail">0 / 0</span><div class="bar"></div></div><div class="court-section" id="pos3" style="flex:0 0 22.5%"><span class="section-number">3</span><span class="quote">—</span><span class="detail">0 / 0</span><div class="bar"></div></div><div class="court-section" id="pos4" style="flex:0 0 22.5%"><span class="section-number">4</span><span class="quote">—</span><span class="detail">0 / 0</span><div class="bar"></div></div><div class="court-section" id="pos5" style="flex:0 0 22.5%"><span class="section-number">5</span><span class="quote">—</span><span class="detail">0 / 0</span><div class="bar"></div></div><div class="court-section empty" style="flex:0 0 5%"><span class="section-number">6</span></div><div class="court-lines"><div class="goal-area"></div><div class="nine-meter"></div></div></div></div>
</section>
</div></section></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://lyrqevymateeftoqxbua.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_JRYstud4CcOx7sC27GQlYQ_xziqf5df';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const state={meta:{opponent:'',matchDate:''},offense:{entries:[],sort:{key:'index',dir:'desc'},filter:[]},defense:{entries:[],sort:{key:'index',dir:'desc'},filter:[]}};
const $=id=>document.getElementById(id);
const el={setup:$('setup'),workspace:$('workspace'),opponent:$('opponent'),matchDate:$('matchDate'),startBtn:$('startBtn'),pdfBtn:$('pdfBtn'),headline:$('headline'),topMeta:$('topMeta'),offenseCount:$('offenseCount'),defenseCount:$('defenseCount'),offenseSortInfo:$('offenseSortInfo'),defenseSortInfo:$('defenseSortInfo'),offenseBody:$('offenseTableBody'),defenseBody:$('defenseTableBody')};
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const half=v=>v==='2.hz'||v==='2. HZ'?'2. HZ':'1. HZ';
const normHalf=v=>v==='2.hz'||v==='2. HZ'?'2.hz':'1.hz';
const normNumber=v=>Array.isArray(v)?(v.length?v:['6:6']):(!v?['6:6']:String(v).split(' + ').filter(Boolean));
const finishDisplay=e=>e.finishPosition==='freiwurf'?'Freiwurf':e.finishPosition==='tf'?'TF':e.finishPosition||'';
const finishClass=s=>s==='green'?'green-tag':s==='yellow'?'yellow-tag':'red-tag';
const numberClass=s=>s==='6:6'?'number':s==='6:5'?'number':s==='7:6'?'number':s==='Tempo'?'number':'number';
const options={offense:{structure:{label:'Struktur',values:['Kreis breit 1/2','Kreis breit 5/6','2/3','4/5','3/4 -> 2','3/4 -> 5','3/4','1. Welle','2. Welle','3. Welle','Schnelle Mitte']},position:{label:'Position',values:['2','3','4','5']},half:{label:'Halbzeit',values:['1. HZ','2. HZ']},number:{label:'Zahl',values:['6:6','6:5','7:6']},result:{label:'Ergebnis',values:['gute Chance - Tor','gute Chance - kein Tor','Freiwurf','TF','schlechte Chance - kein Tor','schlechte Chance - Tor']}},defense:{position:{label:'Position',values:['2','3','4','5']},finishPosition:{label:'Abschlussposition',values:['Außen','Kreis/DBR breit','Kreis/DBR zentral','Fernwurf','7m','Freiwurf','TF']},half:{label:'Halbzeit',values:['1. HZ','2. HZ']},number:{label:'Zahl',values:['6:6','6:5','7:6','Tempo']},result:{label:'Ergebnis',values:['Erfolg','Misserfolg','Freiwurf','TF']}}};
function mapRows(data){state.offense.entries=data.filter(r=>r.side==='offense').map(r=>({...r,createdOrder:r.created_order??r.createdOrder??0,structure:r.structure??'',position:r.attack_position??r.position??'',half:normHalf(r.half),number:r.number_relation??r.number??'6:6',group:r.result_group,result:r.result??'',resultDisplay:r.result_display??r.resultDisplay??r.result??''}));state.defense.entries=data.filter(r=>r.side==='defense').map(r=>({...r,createdOrder:r.created_order??r.createdOrder??0,position:r.attack_position??r.position??'',positionSide:r.position_side??'',finishPosition:r.finish_position??'',finishSide:r.finish_side??'',half:normHalf(r.half),number:r.number_relation??r.number??'6:6',result:r.result??'',resultDisplay:r.result_display??r.result??''}))}
async function load(){const result=await db.from('match_actions').select('*').eq('match_opponent',state.meta.opponent).eq('match_date',state.meta.matchDate).order('created_order',{ascending:true});if(result.error){console.error(result.error);mapRows([]);return}mapRows(result.data||[])}
function sortValue(r,key){if(key==='index')return r.createdOrder??0;if(key==='structure')return r.structure||'';if(key==='position'||key==='positionLabel')return r.position||'';if(key==='finishPositionLabel')return finishDisplay(r);if(key==='half')return half(r.half);if(key==='number')return normNumber(r.number).join(' + ');if(key==='result')return r.resultDisplay||r.result||'';return''}
function sorted(domain){const s=state[domain];const factor=s.sort.dir==='asc'?1:-1;return [...s.entries].sort((a,b)=>{const av=sortValue(a,s.sort.key),bv=sortValue(b,s.sort.key);const c=typeof av==='number'&&typeof bv==='number'?av-bv:String(av).localeCompare(String(bv),'de');return (c||((a.createdOrder??0)-(b.createdOrder??0)))*factor})}
function matches(r,f){if(f.key==='structure')return String(r.structure||'').split(' + ').includes(f.value);if(f.key==='position')return r.position===f.value;if(f.key==='half')return half(r.half)===f.value;if(f.key==='number')return normNumber(r.number).includes(f.value);if(f.key==='finishPosition')return finishDisplay(r)===f.value;if(f.key==='result')return(r.resultDisplay||r.result||'')===f.value;return true}
function filtered(domain){return sorted(domain).filter(r=>state[domain].filter.every(f=>matches(r,f)))}
function renderFilters(domain){const selected=state[domain].filter;$(domain+'FilterControls').innerHTML=Object.entries(options[domain]).map(([key,s])=>`<div class="filter-group"><div class="filter-group-title">${esc(s.label)}</div><div class="filter-options">${s.values.map(v=>`<label class="filter-option"><input type="checkbox" data-key="${esc(key)}" data-value="${esc(v)}" ${selected.some(x=>x.key===key&&x.value===v)?'checked':''}>${esc(v)}</label>`).join('')}</div></div>`).join('');$(domain+'FilterControls').querySelectorAll('input').forEach(input=>input.addEventListener('change',()=>toggleFilter(domain,input.dataset.key,input.dataset.value,input.checked)));$(domain+'FilterTags').innerHTML=selected.map(f=>`<span class="filter-tag">${esc(options[domain][f.key].label)}: ${esc(f.value)}<button type="button" data-key="${esc(f.key)}" data-value="${esc(f.value)}">×</button></span>`).join('');$(domain+'FilterTags').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>toggleFilter(domain,b.dataset.key,b.dataset.value,false)));$(domain+'FilterSummary').textContent=selected.length?selected.length+' aktiv':'keine Auswahl'}
function toggleFilter(domain,key,value,checked){const list=state[domain].filter;const exists=list.some(f=>f.key===key&&f.value===value);if(checked&&!exists){if(list.length>=3){alert('Es können höchstens drei Filter ausgewählt werden.');return}list.push({key,value})}else if(!checked)state[domain].filter=list.filter(f=>!(f.key===key&&f.value===value));renderTable(domain)}
function renderTable(domain){const rows=filtered(domain);const body=domain==='offense'?el.offenseBody:el.defenseBody;const store=state[domain];$(domain+'Count').textContent=store.entries.length+' Einträge';const labels=domain==='offense'?{index:'#',structure:'Struktur',position:'Position',half:'Halbzeit',result:'Ergebnis',number:'Zahl'}:{index:'#',positionLabel:'Position',finishPositionLabel:'Abschlussposition',half:'Halbzeit',number:'Zahl'};$(domain+'SortInfo').textContent=(labels[store.sort.key]||store.sort.key)+' '+(store.sort.dir==='asc'?'↑':'↓');renderFilters(domain);if(!rows.length){body.innerHTML=`<tr><td colspan="${domain==='offense'?6:5}" class="empty">Noch keine Einträge.</td></tr>`;return}if(domain==='offense'){body.innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.structure?`<span class="pill structure">${esc(r.structure)}</span>`:'—'}</td><td>${r.position?`<span class="pill position">${esc(r.position)}</span>`:'—'}</td><td><span class="pill structure">${esc(half(r.half))}</span></td><td>${esc(r.resultDisplay||r.result||'')}</td><td>${normNumber(r.number).map(n=>`<span class="pill number">${esc(n)}</span>`).join(' ')}</td></tr>`).join('')}else{body.innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td><span class="pill ${r.positionSide==='green'?'green-tag':'red-tag'}">${esc(r.position||'—')}</span></td><td><span class="pill ${finishClass(r.finishSide)}">${esc(finishDisplay(r)||'—')}</span></td><td><span class="pill structure">${esc(half(r.half))}</span></td><td>${normNumber(r.number).map(n=>`<span class="pill number">${esc(n)}</span>`).join(' ')}</td></tr>`).join('')}}
function renderChart(){['2','3','4','5'].forEach(p=>{const rows=state.defense.entries.filter(r=>r.position===p);const won=rows.filter(r=>r.positionSide==='green').length;const total=rows.length;const q=total?Math.round(won/total*100):null;const box=$('pos'+p);box.querySelector('.quote').textContent=q===null?'—':q+'%';box.querySelector('.detail').textContent=won+' / '+total;const bar=box.querySelector('.bar');bar.style.width=(q||0)+'%';bar.style.background=q===null?'#bbb':q<40?'#b13a3a':q<60?'#a97900':'#3f7d32'})}
async function refresh(){await load();renderTable('offense');renderTable('defense');renderChart()}
function startApp(){const opponent=el.opponent.value.trim();const date=el.matchDate.value;if(!opponent||!date){alert('Bitte Gegner und Datum eintragen.');return}state.meta={opponent,matchDate:date};el.headline.textContent='Anzeige vs '+opponent;el.topMeta.textContent=new Date(date+'T00:00:00').toLocaleDateString('de-DE');el.setup.classList.add('hidden');el.workspace.classList.remove('hidden');refresh()}
function sortClick(domain,key){const s=state[domain];if(s.sort.key===key)s.sort.dir=s.sort.dir==='asc'?'desc':'asc';else{s.sort.key=key;s.sort.dir=key==='index'?'desc':'asc'}renderTable(domain)}
function toggleMenu(domain){$(domain+'FilterBox').classList.toggle('open')}
function exportPdf(){if(!window.jspdf||!window.jspdf.jsPDF){alert('PDF-Modul nicht geladen.');return}const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});doc.setFontSize(16);doc.text('Kollektive Statistik vs '+state.meta.opponent,14,14);doc.setFontSize(10);doc.text('Datum: '+new Date(state.meta.matchDate+'T00:00:00').toLocaleDateString('de-DE'),14,21);doc.setFontSize(12);doc.text('Abwehr',14,30);const rows=state.defense.entries.map((r,i)=>[i+1,r.position||'',finishDisplay(r),half(r.half),normNumber(r.number).join(' + ')]);doc.autoTable({head:[['#','Position','Abschlussposition','Halbzeit','Zahl']],body:rows,startY:33});let y=doc.lastAutoTable.finalY+10;doc.text('Zweikampfquote nach Position',14,y);const chartRows=['2','3','4','5'].map(p=>{const a=state.defense.entries.filter(r=>r.position===p);const w=a.filter(r=>r.positionSide==='green').length;return['Position '+p,a.length?Math.round(w/a.length*100)+'%':'—',w+' / '+a.length]});doc.autoTable({head:[['Position','Quote','Gewonnen / Total']],body:chartRows,startY:y+3});doc.save('Kollektive_Statistik.pdf')}
$('startBtn').addEventListener('click',startApp);$('opponent').addEventListener('keydown',e=>{if(e.key==='Enter')startApp()});$('matchDate').addEventListener('keydown',e=>{if(e.key==='Enter')startApp()});$('pdfBtn').addEventListener('click',exportPdf);['offense','defense'].forEach(d=>{$(d+'FilterToggle').addEventListener('click',()=>toggleMenu(d));$(d+'FilterReset').addEventListener('click',()=>{state[d].filter=[];renderTable(d)})});document.querySelectorAll('th button[data-table]').forEach(b=>b.addEventListener('click',()=>sortClick(b.dataset.table,b.dataset.sort)));document.addEventListener('click',e=>{if(!e.target.closest('.filter-box'))document.querySelectorAll('.filter-box.open').forEach(x=>x.classList.remove('open'))});$('matchDate').value=new Date().toISOString().slice(0,10);db.channel('match-actions-live').on('postgres_changes',{event:'*',schema:'public',table:'match_actions'},()=>{if(state.meta.opponent&&state.meta.matchDate)refresh()}).subscribe();
})();
</script>
</body>
</html>
