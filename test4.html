  function renderFilterControls(domain){const mount=document.getElementById(`${domain}FilterControls`),selected=state[domain].filter.items||[];mount.innerHTML=Object.entries(FILTER_OPTIONS[domain]).map(([key,spec])=>`<div class="filter-group"><div class="filter-group-title">${h(spec.label)}</div><div class="filter-options">${spec.values.map(value=>`<label class="filter-option"><input type="checkbox" data-filter-key="${h(key)}" data-filter-value="${h(value)}" ${selected.some(x=>x.key===key&&x.value===value)?"checked":""}>${h(value)}</label>`).join("")}</div></div>`).join("");mount.querySelectorAll("input[type=checkbox]").forEach(input=>input.addEventListener("change",()=>toggleFilter(domain,input.dataset.filterKey,input.dataset.filterValue,input.checked)))}function renderFilterTags(domain){const items=state[domain].filter.items||[],tags=document.getElementById(`${domain}FilterTags`),summary=document.getElementById(`${domain}FilterSummary`);summary.textContent=items.length?`${items.length} aktiv`:"keine Auswahl";tags.innerHTML=items.map(item=>`<span class="filter-tag">${h(FILTER_OPTIONS[domain][item.key].label)}: ${h(item.value)}<button type="button" data-remove-key="${h(item.key)}" data-remove-value="${h(item.value)}" aria-label="Filter entfernen">×</button></span>`).join("");tags.querySelectorAll("button[data-remove-key]").forEach(button=>button.addEventListener("click",()=>toggleFilter(domain,button.dataset.removeKey,button.dataset.removeValue,false)))}function toggleFilter(domain,key,value,checked){const items=state[domain].filter.items||[],exists=items.some(x=>x.key===key&&x.value===value);if(checked&&!exists){if(items.length>=3){alert("Es können höchstens drei Filter ausgewählt werden.");renderTable(domain);return}state[domain].filter.items=[...items,{key,value}]}else if(!checked&&exists)state[domain].filter.items=items.filter(x=>!(x.key===key&&x.value===value));renderTable(domain)}function resetFilter(domain){state[domain].filter.items=[];renderTable(domain)}fu   function renderTable(domain){const store=state[domain],rows=filteredEntries(domain),body=els[`${domain}TableBody`];renderFilterControls(domain);renderFilterTags(domain);els[`${domain}Count`].textContent=`${store.entries.length} Einträge`;const labels=domain==="offense"?{index:"#",structure:"Struktur",position:"Position",half:"Halbzeit",result:"Ergebnis",number:"Zahl"}:{index:"#",positionLabel:"Position",finishPositionLabel:"Abschlussposition",half:"Halbzeit",number:"Zahl"};els[`${domain}SortInfo`].textContent=`${labels[store.sort.key]||store.sort.key} ${store.sort.dir==="asc"?"↑":"↓"}`;if(!rows.length){body.innerHTML=`<tr><td colspan="${domain==="offense"?6:5}" class="empty">Noch keine ${domain==="offense"?"offensiven":"defensiven"} Einträge.</td></tr>`;return}if(domain==="offense")body.innerHTML=rows.map((row,index)=>`<tr><td>${index+1}</td><td>${row.structure?`<span class="pill structure">${h(row.structure)}</span>`:"—"}</td><td>${row.position?`<span class="pill position">${h(row.position)}</span>`:"—"}</td><td>${row.half?`<span class="pill structure">${h(halfDisplay(row.half))}</span>`:"—"}</td><td class="result-cell ${row.group||""}">${h(row.resultDisplay||row.result||"")}</td><td>${row.number?normalizeNumber(row.number).map(n=>`<span class="pill number ${numberClass(n)}">${h(n)}</span>`).join(" "):"—"}</td></tr>`).join("");else body.innerHTML=rows.map((row,index)=>`<tr><td>${index+1}</td><td>${row.position?`<span class="pill ${row.positionSide==="green"?"green-tag":"red-tag"}">${h(row.position)}</span>`:"—"}</td><td>${row.finishPosition?`<span class="pill ${finishClass(row.finishSide)}">${h(defenseFinishDisplay(row))}</span>`:"—"}</td><td>${row.half?`<span class="pill structure">${h(halfDisplay(row.half))}</span>`:"—"}</td><td>${row.number?normalizeNumber(row.number).map(n=>`<span class="pill number ${numberClass(n)}">${h(n)}</span>`).join(" "):"—"}</td></tr>`).join("")}
  function renderQuoteChart(){const entries=state.defense.entries;const positions=["2","3","4","5"];const stats={};positions.forEach(p=>{const total=entries.filter(e=>e.position===p).length;const won=entries.filter(e=>e.position===p&&e.positionSide==="green").length;stats[p]={total,won,quote:total?Math.round(won/total*100):null}});positions.forEach(p=>{const el=document.getElementById(`pos${p}`);const s=stats[p];const quoteEl=el.querySelector(".quote");const detailEl=el.querySelector(".detail");const barEl=el.querySelector(".bar");if(s.total===0){quoteEl.textContent="—";detailEl.textContent="0 / 0";barEl.style.width="0%";barEl.style.background="linear-gradient(90deg,#b13a3a,#a97900,#3f7d32)";barEl.style.opacity="0.25";}else{quoteEl.textContent=`${s.quote}%`;detailEl.textContent=`${s.won} / ${s.total}`;barEl.style.width=`${s.quote}%`;const color=s.quote<40?"#b13a3a":s.quote<60?"#a97900":"#3f7d32";barEl.style.background=`linear-gradient(90deg,${color},${color})`;barEl.style.opacity="1";}}}
  function exportPdf(){if(!window.jspdf||!window.jspdf.jsPDF){alert("Der PDF-Export konnte nicht geladen werden. Bitte öffne die App einmal mit Internetverbindung und versuche es erneut.");return}const{jsPDF}=window.jspdf,doc=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});if(typeof doc.autoTable!=="function"){alert("Das PDF-Tabellenmodul konnte nicht geladen werden. Bitte öffne die App mit Internetverbindung und versuche es erneut.");return}const offenseRows=sortEntries("offense").map((row,index)=>[index+1,row.structure||"",row.position||"",halfDisplay(row.half),row.resultDisplay||row.result||"",Array.isArray(row.number)?row.number.join(" + "):row.number||""]),defenseRows=sortEntries("defense").map((row,index)=>[index+1,row.position||"",defenseFinishDisplay(row),halfDisplay(row.half),Array.isArray(row.number)?row.number.join(" + "):row.number||""]);doc.setFontSize(16);doc.text(`Kollektive Statistik vs ${state.meta.opponent}`,14,14);doc.setFontSize(10);doc.text(`Datum: ${fmtDate(state.meta.matchDate)}`,14,21);doc.setFontSize(12);doc.text("Angriff",14,30);doc.autoTable({head:[["#","Struktur","Position","Halbzeit","Ergebnis","Zahl"]],body:offenseRows.length?offenseRows:[["","Keine Einträge","","","",""]],startY:33,theme:"grid",styles:{fontSize:7.5,cellPadding:2,lineWidth:.2,lineColor:[140,140,140]},headStyles:{fillColor:[230,242,241],textColor:20}});let y=doc.lastAutoTable.finalY+10;if(y>170){doc.addPage();y=18}doc.setFontSize(12);doc.text("Abwehr",14,y);doc.autoTable({head:[["#","Position","Abschlussposition","Halbzeit","Zahl"]],body:defenseRows.length?defenseRows:[["","Keine Einträge","","",""]],startY:y+3,theme:"grid",styles:{fontSize:7.5,cellPadding:2,lineWidth:.2,lineColor:[140,140,140]},headStyles:{fillColor:[248,232,233],textColor:20}});y=doc.lastAutoTable.finalY+10;if(y>170){doc.addPage();y=18}doc.setFontSize(12);doc.text("Zweikampfquote nach Position",14,y);const positions=["2","3","4","5"];const entries=state.defense.entries;const rows=positions.m   async function refreshAll(){if(!state.meta.opponent||!state.meta.matchDate)return;await loadMatchActions();renderTable("offense");renderTable("defense");renderQuoteChart()}function startApp(){const opponent=els.opponent.value.trim(),matchDate=els.matchDate.value;if(!opponent||!matchDate){alert("Bitte Gegner und Datum eintragen.");return}state.meta={opponent,matchDate};els.headline.textContent=`Anzeige vs ${opponent}`;els.topMeta.textContent=fmtDate(matchDate);els.setup.classList.add("hidden");els.workspace.classList.remove("hidden");refreshAll()}
