<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Handball Kollektiv - Anzeige</title>
<meta name="theme-color" content="#0b4f16" />
<style>
:root{--text-sm:clamp(.9rem,.82rem + .25vw,1rem);--text-base:clamp(1rem,.95rem + .25vw,1.08rem);--text-lg:clamp(1.12rem,1.02rem + .45vw,1.35rem);--text-xl:clamp(1.35rem,1.2rem + .6vw,1.7rem);--space-2:.5rem;--space-3:.75rem;--space-4:1rem;--space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--radius-md:.8rem;--radius-lg:1rem;--radius-xl:1.25rem;--shadow-md:0 12px 28px rgba(9,27,12,.08);--shadow-sm:0 2px 6px rgba(9,27,12,.06);--bg:#f3f5f0;--surface:rgba(255,255,255,.93);--surface-2:#eef2ea;--border:rgba(18,35,20,.12);--text:#1f261f;--muted:#647064;--primary:#0d5b1f;--primary-2:#1e7a31;--fox-red:#d91f26;--fox-red-dark:#b8171d;--green-strong:#3f7d32;--red-strong:#b13a3a;--yellow-strong:#a97900}
*{box-sizing:border-box}html,body{margin:0;padding:0}html{scroll-behavior:smooth}
body{min-height:100vh;font-family:Arial,sans-serif;font-size:var(--text-base);color:#111;background:radial-gradient(circle at top left,rgba(13,91,31,.12),transparent 30%),linear-gradient(180deg,rgba(13,91,31,.04),rgba(243,245,240,1) 26%),var(--bg)}
button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.app{max-width:1360px;margin:0 auto;padding:var(--space-5)}
.panel{width:100%;border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--surface);box-shadow:var(--shadow-md);backdrop-filter:blur(10px)}
.setup{max-width:760px;margin:6vh auto 0;padding:clamp(4.5rem,8vw,6rem) var(--space-8) var(--space-8);position:relative;overflow:hidden}
.setup::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,rgba(255,255,255,.72),rgba(255,255,255,.93) 38%,rgba(255,255,255,.99)),linear-gradient(135deg,rgba(13,91,31,.03),rgba(217,31,38,.02));pointer-events:none}
.setup-grid{display:grid;gap:var(--space-5);justify-items:center;align-content:center;min-height:520px;position:relative;z-index:1}
.logo-setup{width:100%;min-height:320px;position:relative;background:url("logo.png.JPG") center/contain no-repeat;opacity:.8}
.field{text-align:center}.field label{display:block;font-weight:700;margin-bottom:var(--space-2)}
.field input{width:min(100%,360px);border:1px solid var(--border);border-radius:var(--radius-md);padding:1rem;background:#fff;color:var(--text)}
.field input:focus{outline:2px solid rgba(13,91,31,.15);border-color:var(--primary)}
.start-btn{min-height:52px;border-radius:var(--radius-md);border:1px solid transparent;font-weight:700;background:linear-gradient(90deg,var(--primary),var(--primary-2));color:#fff;min-width:160px}
.workspace{margin-top:var(--space-5)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);padding:var(--space-5) var(--space-6);margin-bottom:var(--space-5);background:linear-gradient(90deg,rgba(255,255,255,.98),rgba(245,247,243,.98));position:relative}
.brand-stack{display:flex;align-items:center;gap:var(--space-4);min-width:0}
.brand-logo{width:92px;height:92px;border-radius:22px;object-fit:contain;background:#fff;padding:8px;border:1px solid rgba(18,35,20,.08);box-shadow:var(--shadow-sm)}
.topbar h1{margin:0;font-size:var(--text-xl)}
.topbar-meta{color:var(--muted);font-size:var(--text-sm);margin-top:var(--space-2)}
.topbar-actions{display:flex;gap:var(--space-3);flex-wrap:wrap}
.utility-btn{background:#fff;border-color:var(--border);padding:.8rem 1rem;color:#000}
.utility-btn.primary{color:#fff;background:var(--primary);border-color:var(--primary)}
.tables{display:grid;gap:var(--space-5);margin-top:var(--space-5)}
.table-card{padding:var(--space-5);position:relative;overflow:hidden}
.table-card.offense{border-top:8px solid var(--primary);background:linear-gradient(180deg,rgba(13,91,31,.07),rgba(255,255,255,.95) 26%)}
.table-card.defense{border-top:8px solid var(--fox-red);background:linear-gradient(180deg,rgba(217,31,38,.07),rgba(255,255,255,.95) 26%)}
.table-tools{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap}
.table-tools h2{margin:0;font-size:var(--text-lg)}
.entry-count{border-radius:999px;padding:.35rem .75rem;font-size:var(--text-sm);font-weight:700}
.offense .entry-count{background:rgba(13,91,31,.12);color:var(--primary)}
.defense .entry-count{background:rgba(217,31,38,.12);color:var(--fox-red-dark)}
.sort-info{font-size:var(--text-sm);color:var(--muted);font-weight:700}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:#fff;max-width:100%}
table{width:100%;table-layout:fixed;border-collapse:collapse}
th,td{padding:.82rem .72rem;border-bottom:1px solid rgba(40,37,29,.09);text-align:left;vertical-align:top;word-break:break-word}
th{position:sticky;top:0;background:var(--surface-2);z-index:1;color:#111}
th button{background:transparent;border:0;padding:0;font:inherit;font-weight:700;color:#111}
th button:hover{text-decoration:underline}
tbody tr:hover{background:#faf8f3}
.result-cell.green{background:rgba(220,239,214,.82)}
.result-cell.red{background:rgba(247,219,219,.82)}
.result-cell.yellow{background:rgba(247,237,198,.88)}
.result-cell.split-green-red{background:linear-gradient(90deg,rgba(220,239,214,.82) 0 50%,rgba(247,219,219,.82) 50% 100%)}
.result-cell.split-red-green{background:linear-gradient(90deg,rgba(247,219,219,.82) 0 50%,rgba(220,239,214,.82) 50% 100%)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:.2rem .55rem;background:#eee;font-size:var(--text-sm);font-weight:700}
.pill.position{background:#eef0f7;color:#33406b}
.pill.structure{background:#e7f4ea;color:#19502a}
.pill.number{background:#f2edf8;color:#53306f}
.pill.green-tag{background:#e1f0dc;color:#1b5c26}
.pill.red-tag{background:#f8dfdf;color:#8d2424}
.pill.yellow-tag{background:#f7edc6;color:#7b5c00}
.empty{padding:var(--space-8);text-align:center;color:var(--muted)}
@media (max-width:1100px){.dual-grid{grid-template-columns:1fr}}
@media (max-width:760px){.app{padding:var(--space-4)}.setup,.table-card,.topbar{padding:var(--space-4)}.topbar{flex-direction:column;align-items:stretch}.brand-stack{align-items:flex-start}}
</style>
</head>
<body>
<div class="app">

  <section id="setup" class="panel setup">
    <div class="setup-grid">
      <div class="logo-setup"></div>
      <div class="field">
        <label for="opponent">Gegner</label>
        <input id="opponent" type="text" placeholder="Gegner eingeben">
      </div>
      <div class="field">
        <label for="matchDate">Datum</label>
        <input id="matchDate" type="date">
      </div>
      <button id="startBtn" class="start-btn" type="button">Start</button>
    </div>
  </section>

  <section id="workspace" class="workspace hidden">
    <div class="panel topbar">
      <div class="brand-stack">
        <img id="brandLogo" src="./logo.png.JPG" alt="Logo" class="brand-logo" width="72" height="72">
        <div>
          <h1 id="headline">Anzeige</h1>
          <div id="topMeta" class="topbar-meta"></div>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="pdfBtn" class="utility-btn primary" type="button">Export PDF</button>
      </div>
    </div>

    <div class="tables">
      <section class="panel table-card offense">
        <div class="table-tools">
          <h2>Offensive Aktionen</h2>
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <div class="entry-count" id="offenseCount">0 Einträge</div>
            <div id="offenseSortInfo" class="sort-info"></div>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:7%"><button type="button" data-table="offense" data-sort="index">#</button></th>
                <th style="width:23%"><button type="button" data-table="offense" data-sort="structure">Struktur</button></th>
                <th style="width:15%"><button type="button" data-table="offense" data-sort="position">angegriffene Position</button></th>
                <th style="width:23%"><button type="button" data-table="offense" data-sort="result">Ergebnis</button></th>
                <th style="width:15%"><button type="button" data-table="offense" data-sort="number">Zahl</button></th>
              </tr>
            </thead>
            <tbody id="offenseTableBody"><tr><td colspan="5" class="empty">Noch keine offensiven Einträge.</td></tr></tbody>
          </table>
        </div>
      </section>

      <section class="panel table-card defense">
        <div class="table-tools">
          <h2>Defensive Aktionen</h2>
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <div class="entry-count" id="defenseCount">0 Einträge</div>
            <div id="defenseSortInfo" class="sort-info"></div>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:7%"><button type="button" data-table="defense" data-sort="index">#</button></th>
                <th style="width:20%"><button type="button" data-table="defense" data-sort="positionLabel">angegriffene Position</button></th>
                <th style="width:28%"><button type="button" data-table="defense" data-sort="finishPositionLabel">Abschlussposition</button></th>
                <th style="width:15%"><button type="button" data-table="defense" data-sort="number">Zahl</button></th>
              </tr>
            </thead>
            <tbody id="defenseTableBody"><tr><td colspan="4" class="empty">Noch keine defensiven Einträge.</td></tr></tbody>
          </table>
        </div>
      </section>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const SUPABASE_URL = "https://lyrqevymateeftoqxbua.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_JRYstud4CcOx7sC27GQlYQ_xziqf5df";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const state = {
    meta: { opponent: '', matchDate: '' },
    offense: { entries: [], sort: { key: 'index', dir: 'desc' } },
    defense: { entries: [], sort: { key: 'index', dir: 'desc' } }
  };

  const els = {
    setup: document.getElementById('setup'),
    workspace: document.getElementById('workspace'),
    opponent: document.getElementById('opponent'),
    matchDate: document.getElementById('matchDate'),
    startBtn: document.getElementById('startBtn'),
    pdfBtn: document.getElementById('pdfBtn'),
    headline: document.getElementById('headline'),
    topMeta: document.getElementById('topMeta'),
    offenseCount: document.getElementById('offenseCount'),
    defenseCount: document.getElementById('defenseCount'),
    offenseSortInfo: document.getElementById('offenseSortInfo'),
    defenseSortInfo: document.getElementById('defenseSortInfo'),
    offenseTableBody: document.getElementById('offenseTableBody'),
    defenseTableBody: document.getElementById('defenseTableBody')
  };

  const fmtDate = v => new Date(v + 'T00:00:00').toLocaleDateString('de-DE');
  const h = s => String(s ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;");

  function isDefenseSuccess(entry) {
    return entry.result === 'defense_success' || (entry.positionSide === 'green' && entry.finishSide === 'green');
  }

  function numberClass(value) {
    if (value === '6:6') return 'number-66';
    if (value === '6:5') return 'number-65';
    if (value === '7:6') return 'number-76';
    return 'number-default';
  }

  function defenseSideLabel(side) {
    if (side === 'green') return 'grün';
    if (side === 'red') return 'rot';
    if (side === 'yellow') return 'gelb';
    return '';
  }

  function defenseFinishDisplay(entry) {
    if (entry.finishPosition === 'freiwurf') return 'Freiwurf';
    if (entry.finishPosition === 'tf') return 'TF';
    return entry.finishPosition || '';
  }

  function defenseFinishTagClass(side) {
    if (side === 'green') return 'green-tag';
    if (side === 'yellow') return 'yellow-tag';
    return 'red-tag';
  }

  async function loadMatchActions() {
    const { data, error } = await supabase
      .from('match_actions')
      .select('*')
      .eq('match_opponent', state.meta.opponent)
      .eq('match_date', state.meta.matchDate)
      .order('created_order', { ascending: true });

    if (error) {
      console.error(error);
      state.offense.entries = [];
      state.defense.entries = [];
      return;
    }

    state.offense.entries = data.filter(r => r.side === 'offense').map(r => ({
      ...r,
      id: r.id,
      createdOrder: r.created_order ?? r.createdOrder ?? 0,
      structure: r.structure ?? '',
      position: r.attack_position ?? r.position ?? '',
      finishPosition: r.finish_position ?? '',
      positionSide: r.position_side ?? '',
      finishSide: r.finish_side ?? '',
      number: r.number_relation ?? r.number ?? '6:6',
      group: r.result_group,
      result: r.result ?? '',
      resultDisplay: r.result_display ?? r.resultDisplay ?? r.result ?? ''
    }));

    state.defense.entries = data.filter(r => r.side === 'defense').map(r => ({
      ...r,
      id: r.id,
      createdOrder: r.created_order ?? r.createdOrder ?? 0,
      structure: r.structure ?? '',
      position: r.attack_position ?? r.position ?? '',
      finishPosition: r.finish_position ?? '',
      positionSide: r.position_side ?? '',
      finishSide: r.finish_side ?? '',
      number: r.number_relation ?? r.number ?? '6:6',
      group: r.result_group ?? (
        r.finish_side === 'yellow' ? 'yellow' :
        (r.position_side === 'green' && r.finish_side === 'green' ? 'green' : 'red')
      ),
      result: r.result ?? (
        r.finish_position === 'freiwurf' ? 'freiwurf' :
        r.finish_position === 'tf' ? 'tf' :
        (r.position_side === 'green' && r.finish_side === 'green' ? 'defense_success' : 'defense_fail')
      ),
      resultDisplay: r.result_display ?? (
        r.finish_position === 'freiwurf' ? 'Freiwurf' :
        r.finish_position === 'tf' ? 'TF' :
        (r.position_side === 'green' && r.finish_side === 'green' ? 'Erfolg' : 'Misserfolg')
      )
    }));
  }

  function sortValue(row, key) {
    if (key === 'index') return row.createdOrder ?? 0;
    if (key === 'structure') return row.structure || '';
    if (key === 'position') return row.position || '';
    if (key === 'positionLabel') return `${defenseSideLabel(row.positionSide)} ${row.position || ''}`;
    if (key === 'finishPosition') return defenseFinishDisplay(row) || '';
    if (key === 'finishPositionLabel') return `${defenseSideLabel(row.finishSide)} ${defenseFinishDisplay(row) || ''}`;
    if (key === 'number') return row.number || '';
    if (key === 'result') return row.resultDisplay || row.result || '';
    return '';
  }

  function sortEntries(domain) {
    const store = state[domain];
    const rows = [...store.entries];
    const { key, dir } = store.sort;
    const factor = dir === 'asc' ? 1 : -1;

    rows.sort((a, b) => {
      const av = sortValue(a, key);
      const bv = sortValue(b, key);
      let value = typeof av === 'number' && typeof bv === 'number'
        ? av - bv
        : String(av).localeCompare(String(bv), 'de');
      if (value === 0) value = (a.createdOrder ?? 0) - (b.createdOrder ?? 0);
      return value * factor;
    });

    return rows;
  }

  function setSort(domain, key) {
    const store = state[domain];
    if (store.sort.key === key) {
      store.sort.dir = store.sort.dir === 'asc' ? 'desc' : 'asc';
    } else {
      store.sort.key = key;
      store.sort.dir = key === 'index' ? 'desc' : 'asc';
    }
    renderTable(domain);
  }

  function renderTable(domain) {
    const store = state[domain];
    const body = els[`${domain}TableBody`];
    const countEl = els[`${domain}Count`];
    const sortInfoEl = els[`${domain}SortInfo`];
    const rows = sortEntries(domain);

    countEl.textContent = `${store.entries.length} Einträge`;

    const labels = domain === 'offense'
      ? { index: '#', structure: 'Struktur', position: 'angegriffene Position', result: 'Ergebnis', number: 'Zahl' }
      : { index: '#', positionLabel: 'angegriffene Position', finishPositionLabel: 'Abschlussposition', number: 'Zahl' };

    sortInfoEl.textContent = `${labels[store.sort.key]} ${store.sort.dir === 'asc' ? '↑' : '↓'}`;

    if (!rows.length) {
      body.innerHTML = `<tr><td colspan="${domain === 'offense' ? 5 : 4}" class="empty">Noch keine ${domain === 'offense' ? 'offensiven' : 'defensiven'} Einträge.</td></tr>`;
      return;
    }

    if (domain === 'offense') {
      body.innerHTML = rows.map((row, index) =>
        `<tr>
          <td>${index + 1}</td>
          <td>${row.structure ? `<span class="pill structure">${h(row.structure)}</span>` : '—'}</td>
          <td>${row.position ? `<span class="pill position">${h(row.position)}</span>` : '—'}</td>
          <td class="result-cell ${row.group || ''}">${h(row.resultDisplay || row.result || '')}</td>
          <td>${row.number ? `<span class="pill number ${numberClass(row.number)}">${h(row.number)}</span>` : '—'}</td>
        </tr>`
      ).join('');
    } else {
      body.innerHTML = rows.map((row, index) =>
        `<tr>
          <td>${index + 1}</td>
          <td>${row.position ? `<span class="pill ${row.positionSide === 'green' ? 'green-tag' : 'red-tag'}">${h(row.position)}</span>` : '—'}</td>
          <td>${row.finishPosition ? `<span class="pill ${defenseFinishTagClass(row.finishSide)}">${h(defenseFinishDisplay(row))}</span>` : '—'}</td>
          <td>${row.number ? `<span class="pill number ${numberClass(row.number)}">${h(row.number)}</span>` : '—'}</td>
        </tr>`
      ).join('');
    }
  }

  function applyResultColor(data) {
    if (data.section !== 'body' || data.column.index !== 3) return;
    const value = String(data.cell.raw || '');

    if (value === 'Freiwurf') data.cell.styles.fillColor = [247, 237, 198];
    else if (value === 'TF') data.cell.styles.fillColor = [247, 219, 219];
    else if (value === 'gute Chance - Tor') data.cell.styles.fillColor = [220, 239, 214];
    else if (value === 'schlechte Chance - kein Tor') data.cell.styles.fillColor = [220, 239, 214];
    else if (value === 'gute Chance - kein Tor') data.cell.styles.fillColor = [220, 239, 214];
    else if (value === 'schlechte Chance - Tor') data.cell.styles.fillColor = [247, 219, 219];
  }

  function getNumberFillColor(number) {
    if (number === '6:6') return [255, 255, 255];
    if (number === '7:6') return [240, 247, 255];
    if (number === '6:5') return [255, 249, 240];
    return [255, 255, 255];
  }

  function applyNumberColor(data) {
    if (data.section !== 'body') return;
    
    if (data.table.section === 'Angriff' && data.column.index === 4) {
      const value = String(data.cell.raw || '');
      data.cell.styles.fillColor = getNumberFillColor(value);
    }
    
    if (data.table.section === 'Abwehr' && data.column.index === 3) {
      const value = String(data.cell.raw || '');
      data.cell.styles.fillColor = getNumberFillColor(value);
    }
  }

  function exportPdf() {
    if (!window.jspdf || !window.jspdf.jsPDF) {
      alert('Der PDF-Export konnte nicht geladen werden. Bitte öffne die App einmal mit Internetverbindung und versuche es erneut.');
      return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

    if (typeof doc.autoTable !== 'function') {
      alert('Das PDF-Tabellenmodul konnte nicht geladen werden. Bitte öffne die App mit Internetverbindung und versuche es erneut.');
      return;
    }

    doc.setFontSize(16);
    doc.text(`Kollektive Statistik vs ${state.meta.opponent}`, 14, 14);
    doc.setFontSize(10);
    doc.text(`Datum: ${fmtDate(state.meta.matchDate)}`, 14, 21);

    const offenseRows = sortEntries('offense').map((row, index) => [
      index + 1,
      row.structure || '',
      row.position || '',
      row.resultDisplay || row.result || '',
      row.number || ''
    ]);

    const defenseRows = sortEntries('defense').map((row, index) => [
      index + 1,
      row.positionSide === 'green' ? `grün ${row.position || ''}` : `rot ${row.position || ''}`,
      row.finishSide === 'green'
        ? `grün ${row.finishPosition || ''}`
        : row.finishSide === 'yellow'
          ? `gelb ${row.finishPosition === 'freiwurf' ? 'Freiwurf' : row.finishPosition || ''}`
          : `rot ${row.finishPosition === 'tf' ? 'TF' : row.finishPosition || ''}`,
      row.number || ''
    ]);

    doc.setFontSize(12);
    doc.text('Angriff', 14, 30);

    doc.autoTable({
      head: [['#', 'Struktur', 'Position', 'Ergebnis', 'Zahl']],
      body: offenseRows.length ? offenseRows : [['', 'Keine Einträge', '', '', '']],
      startY: 33,
      theme: 'grid',
      styles: {
        fontSize: 7.5,
        cellPadding: 2,
        lineWidth: .2,
        lineColor: [140, 140, 140]
      },
      headStyles: {
        fillColor: [230, 242, 241],
        textColor: 20
      },
      didParseCell: data => {
        applyResultColor(data);
        applyNumberColor(data);
      }
    });

    let nextY = doc.lastAutoTable.finalY + 10;
    if (nextY > 170) {
      doc.addPage();
      nextY = 18;
    }

    doc.setFontSize(12);
    doc.text('Abwehr', 14, nextY);

    doc.autoTable({
      head: [['#', 'Position', 'Abschlussposition', 'Zahl']],
      body: defenseRows.length ? defenseRows : [['', 'Keine Einträge', '', '']],
      startY: nextY + 3,
      theme: 'grid',
      styles: {
        fontSize: 7.5,
        cellPadding: 2,
        lineWidth: .2,
        lineColor: [140, 140, 140]
      },
      headStyles: {
        fillColor: [248, 232, 233],
        textColor: 20
      },
      didParseCell: data => {
        if (data.section !== 'body') return;
        
        if (data.column.index === 1) {
          const row = defenseRows[data.row.index];
          const positionSide = sortEntries('defense')[data.row.index]?.positionSide || '';
          if (positionSide === 'green') data.cell.styles.fillColor = [225, 240, 220];
          else if (positionSide === 'red') data.cell.styles.fillColor = [248, 223, 223];
        }
        
        if (data.column.index === 2) {
          const row = defenseRows[data.row.index];
          const finishSide = sortEntries('defense')[data.row.index]?.finishSide || '';
          if (finishSide === 'green') data.cell.styles.fillColor = [225, 240, 220];
          else if (finishSide === 'red') data.cell.styles.fillColor = [248, 223, 223];
          else if (finishSide === 'yellow') data.cell.styles.fillColor = [247, 237, 198];
        }
        
        applyNumberColor(data);
      }
    });

    const safeOpponent = state.meta.opponent
      .replace(/[^\wäöüÄÖÜß-]+/g, '_')
      .replace(/^_+|_+$/g, '');

    doc.save(`Kollektive_Statistik_vs_${safeOpponent || 'Gegner'}.pdf`);
  }

  async function refreshAll() {
    if (!state.meta.opponent || !state.meta.matchDate) return;
    await loadMatchActions();
    renderTable('offense');
    renderTable('defense');
  }

  function startApp() {
    const opponent = els.opponent.value.trim();
    const matchDate = els.matchDate.value;

    if (!opponent || !matchDate) {
      alert('Bitte Gegner und Datum eintragen.');
      return;
    }

    state.meta = { opponent, matchDate };
    els.headline.textContent = `Anzeige vs ${opponent}`;
    els.topMeta.textContent = fmtDate(matchDate);
    els.setup.classList.add('hidden');
    els.workspace.classList.remove('hidden');
    refreshAll();
  }

  const brandLogo = document.getElementById('brandLogo');
  if (brandLogo) {
    brandLogo.onerror = () => {
      brandLogo.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><rect width="512" height="512" rx="72" fill="#0d5b1f"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="132" font-weight="700" fill="#ffffff">FÜCHSE</text></svg>`);
    };
  }

  document.querySelectorAll('th button[data-table]').forEach(btn =>
    btn.addEventListener('click', () => setSort(btn.dataset.table, btn.dataset.sort))
  );

  els.startBtn.addEventListener('click', startApp);
  els.pdfBtn.addEventListener('click', exportPdf);

  supabase.channel('match-actions-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'match_actions' }, () => refreshAll())
    .subscribe();
})();
</script>
</body>
</html>
